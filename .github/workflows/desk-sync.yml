name: Desk sync

# Replays Desk approvals from the production ledger into Git once a day, after
# the server's daily pass and the curator's run, then confirms them once the
# merge is deployed. This workflow is the sync owner (README "Ledger operating
# rules"): don't run scripts/sync-desk-commits.mjs by hand while it is enabled.
#
# SYNC_DATABASE_URL is a dedicated Postgres login that can only SELECT
# desk_applied_changes and UPDATE its sha, last_error, last_attempt_at and
# synced_at columns.

on:
  schedule:
    - cron: '30 18 * * *' # 11:30 PDT / 10:30 PST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desk-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SYNC_DATABASE_URL: ${{ secrets.SYNC_DATABASE_URL }}
      SITE: https://grants.watch
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Configure the commit identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"

      - name: Confirm rows an earlier run already deployed
        run: node scripts/sync-desk-commits.mjs --confirm-deployment "$SITE" --db-url "$SYNC_DATABASE_URL"

      # Ledger rows commit first, byte for byte. A later commit in that same
      # branch inserts the NSF apply links; it is not part of the ledger blob,
      # so the rows' base hashes still match main.
      - name: Commit unsynced rows on a sync branch
        id: sync
        run: |
          branch="sync/desk-ledger-$(date -u +%F)-${GITHUB_RUN_ID}"
          git switch -c "$branch"
          node scripts/sync-desk-commits.mjs --dry-run --db-url "$SYNC_DATABASE_URL"
          node scripts/sync-desk-commits.mjs --db-url "$SYNC_DATABASE_URL"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      # Rounds roll past their close date every few days, and npm run validate
      # rejects a live round 6 hours after its deadline: closes_at when given,
      # else the end of the closes day Anywhere on Earth. Both scripts share
      # that rule and read the same pinned instant (VALIDATION_NOW), so a
      # deadline can't pass between closing and validating. Closing runs here,
      # after the rows above are committed, as one more commit on the same
      # branch. Rounds are set to closed, never removed. A file an unsynced
      # row targets is left alone: that row replays at boot until the deploy is
      # confirmed, and replay refuses a file changed underneath it. A stale
      # round in such a file fails this step, and nothing is merged. The count
      # covers rows and closes: zero means there is nothing to merge.
      - name: Close stale rounds on the sync branch
        id: close
        run: |
          now="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "now=$now" >> "$GITHUB_OUTPUT"
          node scripts/sync-desk-commits.mjs --unsynced-paths --db-url "$SYNC_DATABASE_URL" > ledger-paths.txt
          status=0
          VALIDATION_NOW="$now" node scripts/close-stale-rounds.mjs --write --json --ledger-paths ledger-paths.txt > close.json || status=$?
          jq -r '"Close pass as of \(.now): \(.changes | length) closed, \(.held | length) held."' close.json
          jq -r '.changes[] | "  closed \(.file): \"\(.round)\" \(.from) → closed (deadline \(.deadline) by \(.basis); closable after \(.cutoff))"' close.json
          jq -r '.held[] | "  held \(.file): \"\(.round)\" stays \(.from); an unsynced ledger row targets this file"' close.json
          if [ "$status" -ne 0 ]; then exit "$status"; fi
          if git diff --quiet -- registry/programs; then
            echo "No stale rounds."
          else
            {
              jq -r '"Close past-due rounds (\([.changes[].program] | unique | join(", ")))"' close.json
              echo
              jq -r '"Output of scripts/close-stale-rounds.mjs --write as of \(.now):"' close.json
              jq -r '.changes[] | "  \(.file): \"\(.round)\" \(.from) → closed (closes \(.closes); deadline \(.deadline) by \(.basis))"' close.json
              echo
              echo "Deadline expiry closes intake; it does not conclude the program."
            } > close-message.txt
            git add -- registry/programs
            git commit -q -F close-message.txt
            git show --stat --format=%B HEAD
          fi
          echo "commits=$(git rev-list --count origin/main..HEAD)" >> "$GITHUB_OUTPUT"

      # A push made with GITHUB_TOKEN doesn't start the CI workflow, so the
      # checks CI would run on registry data run here before anything reaches main.
      - name: Validate the synced registry
        if: steps.close.outputs.commits != '0'
        env:
          CLOSE_NOW: ${{ steps.close.outputs.now }}
        run: |
          VALIDATION_NOW="$CLOSE_NOW" npm run validate
          npm run validate:funding
          npm test

      - name: Merge into main with a merge commit
        if: steps.close.outputs.commits != '0'
        id: merge
        run: |
          git fetch origin main
          git switch -C main origin/main
          git merge --no-ff "${{ steps.sync.outputs.branch }}" \
            -m "Merge Desk ledger sync (${{ steps.close.outputs.commits }} commits, run ${GITHUB_RUN_ID})"
          git push origin main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Wait for the merge to be deployed
        if: steps.close.outputs.commits != '0'
        run: |
          for i in $(seq 1 90); do
            live=$(curl -fsS --max-time 10 "$SITE/api/v1/deployment" | sed -n 's/.*"commit":"\([a-f0-9]*\)".*/\1/p' || true)
            if [ "$live" = "${{ steps.merge.outputs.sha }}" ]; then echo "Deployed after ${i} checks."; exit 0; fi
            sleep 20
          done
          echo "The merge wasn't deployed within 30 minutes; the next run confirms it." >&2
          exit 1

      - name: Confirm the synced rows
        if: steps.close.outputs.commits != '0'
        run: |
          node scripts/sync-desk-commits.mjs --confirm-deployment "$SITE" --dry-run --db-url "$SYNC_DATABASE_URL"
          node scripts/sync-desk-commits.mjs --confirm-deployment "$SITE" --db-url "$SYNC_DATABASE_URL"
