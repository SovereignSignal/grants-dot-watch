name: Funding closeout verification
on:
  pull_request:
    paths:
      - '.github/workflows/funding-closeout.yml'
      - 'scripts/funding-closeout/**'
      - 'tests/funding-closeout*'
  workflow_dispatch:
    inputs:
      expected_commit:
        description: Optional exact deployed commit SHA
        required: false
        type: string
      require_control:
        description: Require the approved snapshot header
        required: false
        default: true
        type: boolean
permissions:
  contents: read
concurrency:
  group: funding-closeout-${{ github.ref }}
  cancel-in-progress: true
jobs:
  public-read-receipt:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Verify deployed base revision and approved snapshots without credentials or writes
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit || github.event.pull_request.base.sha }}
          REQUIRE_CONTROL: ${{ github.event_name == 'pull_request' || inputs.require_control }}
        shell: bash
        run: |
          args=(--fetch --out "$RUNNER_TEMP/funding-live-verification")
          test -z "$EXPECTED_COMMIT" || args+=(--expected-commit "$EXPECTED_COMMIT")
          test "$REQUIRE_CONTROL" != true || args+=(--require-control)
          node scripts/funding-closeout/live-read.mjs "${args[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: funding-live-verification
          path: ${{ runner.temp }}/funding-live-verification
          retention-days: 1
          if-no-files-found: error
