name: Funding closeout verification
on:
  pull_request:
    paths:
      - '.github/workflows/funding-closeout.yml'
      - 'scripts/funding-closeout/**'
      - 'tests/funding-closeout*'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: funding-closeout-${{ github.ref }}
  cancel-in-progress: true
jobs:
  review-source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Archive tracked source and selected JavaScript test dependencies
        shell: bash
        run: |
          git archive --format=tar --output="$RUNNER_TEMP/funding-review-source.tar" HEAD
          for name in yaml pg pg-pool pg-protocol pg-connection-string pg-types pg-int8 pgpass postgres-array postgres-bytea postgres-date postgres-interval split2 xtend react react-dom scheduler typescript; do
            test ! -d "node_modules/$name" || tar --append --file="$RUNNER_TEMP/funding-review-source.tar" "node_modules/$name"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: funding-review-source
          path: ${{ runner.temp }}/funding-review-source.tar
          retention-days: 1
          if-no-files-found: error
