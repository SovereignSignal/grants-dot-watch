name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: funding_test
          POSTGRES_PASSWORD: local_ci_only
          POSTGRES_DB: funding_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U funding_test -d funding_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run check:public
      - run: npm run validate
      - name: Lint funding implementation and public product
        run: npx eslint src/lib/funding-*.mjs src/lib/public-api-v2.ts src/lib/committer.ts src/lib/desk-decide.ts 'src/app/api/v2/[[...path]]/route.ts' src/app/api/desk/funding/route.ts src/app/api/desk/funding/workspace/route.ts src/app/funding/page.tsx src/app/data/page.tsx src/app/admin/funding/page.tsx src/components/funding/*.tsx scripts/validate-registry-v2.mjs scripts/stage-funding-import.mjs scripts/build-funding-source-packets.mjs scripts/capture-funding-source.mjs tests/funding-*.test.mjs tests/browser/funding-*.spec.ts src/lib/funding-replica-sync.ts scripts/funding-closeout/*.mjs tests/fixtures/funding-replica-reader.mjs --max-warnings=0
      - name: Install matching PostgreSQL backup clients
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client-16
          echo "PG_DUMP_BIN=/usr/lib/postgresql/16/bin/pg_dump" >> "$GITHUB_ENV"
          echo "PG_RESTORE_BIN=/usr/lib/postgresql/16/bin/pg_restore" >> "$GITHUB_ENV"
      - name: Unit and real PostgreSQL integration tests
        run: npm test
        env:
          TEST_DATABASE_URL: postgresql://funding_test:local_ci_only@127.0.0.1:5432/funding_test
      - run: npm run typecheck
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
  native-source-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Capture one pinned public source without credentials or publication
        run: node scripts/capture-funding-source.mjs --source microsoft-foss --fund 35 --revision 621eedf7a92ed5ce562a0820f3bda0c636ea5522 --fetch --out "$RUNNER_TEMP/funding-native-smoke"
      - name: Verify the source-specific selection
        run: |
          node --input-type=module -e '
            import {readFileSync} from "node:fs";
            import {extractSourceSnapshot} from "./src/lib/funding-source-adapters.mjs";
            const root=process.env.RUNNER_TEMP+"/funding-native-smoke";
            const capture=JSON.parse(readFileSync(root+"/capture-receipt.json","utf8"));
            const bundle=JSON.parse(readFileSync(root+"/bundle.json","utf8"));
            const parsed=extractSourceSnapshot(bundle.snapshots[0],bundle.snapshots[0].observed_on);
            if(capture.requests!==1 || parsed.observations.length!==9 || capture.canonical_write!==false) throw new Error("native smoke contract failed");
            console.log("NATIVE_SOURCE_SMOKE "+JSON.stringify({requests:capture.requests,observations:parsed.observations.length,revision:capture.source_revision,upstream_blob:capture.upstream_blob_sha,canonical_write:false}));
          '
