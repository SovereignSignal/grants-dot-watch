name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run check:public
      - run: npm run validate
      - name: Lint funding v2 implementation
        run: npx eslint src/lib/funding-*.mjs src/lib/public-api-v2.ts 'src/app/api/v2/[[...path]]/route.ts' scripts/validate-registry-v2.mjs scripts/stage-funding-import.mjs tests/funding-v2*.test.mjs tests/browser/funding-v2.spec.ts --max-warnings=0
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
