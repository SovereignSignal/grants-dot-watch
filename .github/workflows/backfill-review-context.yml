name: Backfill review context
on:
  pull_request:
    paths:
      - '.github/workflows/backfill-review-context.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Retain only tracked source and exact revision
        run: |
          mkdir "$RUNNER_TEMP/backfill-review"
          git archive --format=tar --output="$RUNNER_TEMP/backfill-review/source.tar" HEAD
          git rev-parse HEAD > "$RUNNER_TEMP/backfill-review/revision.txt"
          git ls-tree -r HEAD > "$RUNNER_TEMP/backfill-review/objects.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: backfill-review-context
          path: ${{ runner.temp }}/backfill-review
          retention-days: 3
          if-no-files-found: error
