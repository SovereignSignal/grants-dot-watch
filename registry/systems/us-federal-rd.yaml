summary: Research and development funding by agencies of the United States federal government.
  Capital moves through peer-reviewed grants (NSF, NIH), small-business innovation awards (SBIR/STTR
  at NSF and AFWERX), program-manager-driven contracts and Broad Agency Announcements (DARPA,
  ARPA-H, BARDA), standards and measurement programs (NIST), and mission initiatives such as the
  Department of Energy's Genesis Mission for AI-accelerated science.
