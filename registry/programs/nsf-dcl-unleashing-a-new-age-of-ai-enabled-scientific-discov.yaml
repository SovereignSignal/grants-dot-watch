summary: 'NSF invites proposals for AI-enabled scientific discovery and foundational research in
  support of the Genesis Mission, in three areas: leveraging AI for science, building foundations
  for the National Science and Technology Challenges, and workforce development. Proposals go to
  current open NSF funding opportunities and use a "Genesis Mission:" title prefix. The DCL was
  posted July 22, 2026 and last updated August 18, 2026.'
