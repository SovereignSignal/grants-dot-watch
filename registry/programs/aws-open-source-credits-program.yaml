summary: AWS gives promotional credits to open source projects, typically used for upstream and
  performance testing, CI/CD and artifact storage on AWS. Projects need an active AWS account and an
  OSI-approved (or field-standard open) license; applicants complete the AWS Open Source Credits
  Application form and email it to awsopen@amazon.com. Applications are reviewed monthly, favoring
  projects with maintainers from multiple entities or owned by foundations or non-profits; credits
  expire after one year. Rolling, no deadline.
