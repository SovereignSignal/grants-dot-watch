summary: >
  A fully funded fellowship run by Watson Institute with Google for community leaders using AI or
  technology in eligible Google data center communities. The 2026 program runs from September 2026
  through January 2027 and includes training, mentorship, a virtual summit, and a $1,000 stipend for
  each fellow's community workshop. The July 12 priority deadline has passed, but applications remain
  open on a rolling basis until the cohort is filled.
