summary: >
  The Cooperative AI Foundation's research grants fund work that improves the
  cooperative intelligence of advanced AI, addressing multi-agent and
  cooperation problems among AI systems and between AI and humans. Grants run
  GBP 10,000-385,000 (median ~GBP 150,000, Early-Career Track up to GBP
  100,000) in periodic rounds via a two-stage pre-proposal and full-proposal
  process; projects run up to 2 years with indirect costs capped at 10%.
