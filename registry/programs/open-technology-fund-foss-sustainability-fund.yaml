summary: "**Open Technology Fund FOSS Sustainability Fund** is accepting rolling applications for
  grants that support the long-term sustainability of free and open source software projects
  critical to internet freedom, privacy, and security. The fund provides financial support to
  maintain and sustain existing FOSS projects that are vital to these areas. There is no fixed
  deadline or specified grant amounts. Eligible projects must be free and open source software with
  clear importance to internet freedom, privacy, or security."
