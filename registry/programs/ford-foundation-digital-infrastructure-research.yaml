summary: >
  A collaborative research-grants initiative — Ford Foundation with the
  Alfred P. Sloan Foundation, Mozilla's Open Source Support programme,
  Omidyar Network, and Open Society Foundations (fiscally hosted by Open
  Collective Foundation for the 2020 round) — funding research on the
  open-source code and digital infrastructure underpinning the internet,
  including how to sustain maintainer communities and address systemic
  inequities in the field. Ran across a 2018 wave (managed jointly by Ford
  and Sloan) and a larger 2020 collaborative wave.
