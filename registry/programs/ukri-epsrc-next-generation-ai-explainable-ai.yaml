summary: Apply to EPSRC's £12M Explainable AI scheme, which opened 11 August 2026 and funds
  speculative, high-risk fundamental research on AI interpretability — mechanistic transparency,
  post-hoc explanations, uncertainty quantification, and inherently explainable model design.
  Individual awards up to £602,500 full economic cost (UKRI covers 80%); UK research organisations
  only; early- and mid-career researchers especially encouraged; two-year projects, no tangible
  outcomes required within the window.
