summary: >
  Gitcoin launched Citizen Grants in 2024 with Citizens Retro, Citizens Innovate, and Citizens Forward.
  After the initial pilot, Gitcoin concluded the Innovate and Forward formats and shifted toward selective
  RFPs and direct grants. The governance forum category remains available, but no current general application
  window has been confirmed.
