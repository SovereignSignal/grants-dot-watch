summary: >-
  **Taiko Grant Program** offers a $25 million fund for open-source projects building on Taiko. 


  The program supports teams working in DeFi, AI, RWA, SocialFi, Gaming, and other verticals, with
  grants awarded on a rolling basis. 


  Eligible projects must be open source and deployed on or integrated with Taiko, and selected
  grantees may receive follow-on investment rights. 


  Apply directly at taiko.xyz/grant-program.
