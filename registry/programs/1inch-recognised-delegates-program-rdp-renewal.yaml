summary: >-
  ## Simple Summary


  This proposal seeks to renew the 1-inch Recognised Delegates Program (RDP) for another term,
  incorporating updated performance requirements, revised compensation tiers, stricter participation
  metrics, and a position cap on funded delegates.


  ## Abstract


  The Recognised Delegates Program was established to incentivise active participation and
  professionalise 1inch DAO governance.
