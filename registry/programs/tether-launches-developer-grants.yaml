summary: Tether has launched a developer grants program funding builders on its open technology
  stack, with no cap on total payouts. Individual payouts range from approximately $1,500 to $4,000,
  paid in USD₮ or Bitcoin, tied to specific technical deliverables rather than open-ended funding.
  The program is now open and accepting applications for active tasks including wallet
  infrastructure, browser extensions, and e-commerce integrations. The effort centers on QVAC, a
  local-first on-device AI platform, and enhancements to Tether's open-source Wallet Development Kit
  (WDK).
