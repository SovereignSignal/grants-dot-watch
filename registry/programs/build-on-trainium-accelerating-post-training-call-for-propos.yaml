summary: "AWS Build on Trainium: Accelerating Post-Training invites academic researchers to apply\
  \ for its Spring 2026 call for proposals. The program offers up to $110M in total promotional compute\
  \ credits, with individual awards of $50K or $250K+ for novel post-training AI research on Trainium\
  \ chips, including new model architectures, optimizations, reinforcement learning, and alignment. \n\
  \nEligible academic researchers receive AWS Promotional Credits, access to Trainium infrastructure,\
  \ and training resources. Applications are open for the Spring 2026 cycle."
