summary: "**Serious People** is seeking grant funding to research liquidity acquisition strategies
  for Arbitrum’s Long-Term Incentive Pilot Program. The proposal, submitted under the Research
  Bucket, evaluates the efficacy of liquidity incentives in Arbitrum’s pilot program and their
  impact on long-term ecosystem growth. The work aims to provide data-driven insights to inform
  future incentive design and capital efficiency on Arbitrum. Full proposal is available on the
  Arbitrum forum."
