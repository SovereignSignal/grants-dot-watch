summary: "Renaissance Philanthropy fund applying AI and machine learning to mathematical research:
  new ML paradigms for mathematical discovery, tools and infrastructure for mathematicians,
  automated theorem proving and AI-assisted proof development, and open mathematical
  datasets/benchmarks. All funded code, datasets, and research outputs must be open-access with
  preprints in public repositories. Initial $9M round expanded by $13M announced March 2026; main
  grants of $100K-$1M for 12-24 months, plus $20K-$30K summer fellowships and up to $100K seed
  grants for early-stage work."
