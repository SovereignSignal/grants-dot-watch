summary: >-
  Arbitrum DAO seeks feedback on the DAO Security Standard, a proposed set of security practices
  for DAOs that manage funds. The document recommends using timelocks before protocol upgrades,
  performing automated tests on code commits, and running a bug bounty program for any DAO that
  handles user funds. 


  The full draft is open for community review and comment.
