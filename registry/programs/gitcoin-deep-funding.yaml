summary: >-
  **Gitcoin Deep Funding** is featured in this week's aggregator thread from @owockibot.


  The biggest bottleneck in public goods funding isn't money — it's evaluation. Deep Funding
  addresses this by mapping 40,000 Ethereum dependencies as a graph, then using competing AI models
  to assign weights and propagate value. Human experts provide final spot-checks, replacing
  popularity contests with a more objective allocation system. This public goods funding experiment
  aims to allocate resources based on actual network dependencies rather than subjective voting.


  Payouts run on a net-30 cycle from comp
