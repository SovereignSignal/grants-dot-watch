summary: "**Starknet Early Adopter Grants** published an independent analysis of its Round 1
  results, highlighting inconsistencies in the evaluation process. The analysis includes a public
  spreadsheet showing exact points awarded to each project across all criteria. It raises concerns
  about scoring transparency and fairness ahead of the upcoming Early Community Member Program
  grants. The report examines the full allocation data from the first round and recommends
  improvements for future distributions."
