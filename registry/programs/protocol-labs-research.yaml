summary: >
  Protocol Labs Research funds goal-driven and open research advancing distributed
  systems, cryptography, networking, and web3/crypto-networks (the technologies
  behind IPFS, Filecoin, and related projects), via topic-specific RFPs, a wildcard
  RFP-X, open research awards, and fellowships (e.g. a $60k PL Research Doctoral
  Fellowship; Cryptonet network grants of ~$25k-$35k). Individual RFPs are reviewed on
  their own schedules. The general Open Research Grants program has been paused since
  early 2023.
