summary: >-
  **ZKsync Catalyst Program launches**


  The ZKsync Catalyst Program is now accepting applications for ecosystem growth grants. The
  initiative, modeled after the Uniswap Arbitrum Capital Allocation Program that the team previously
  designed and managed, supports projects building on ZKsync. 


  Applicants may be asked to provide a list of case studies and referrals. The program follows an
  onchain governance model and focuses on capital allocation, execution, and transparent reporting. 


  Apply directly through the ZK Nation forum.
