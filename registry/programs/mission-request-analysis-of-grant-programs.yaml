summary: >-
  Optimism is requesting an analysis of grant programs and their failure modes to improve the
  effectiveness and sustainability of future grant cycles, especially as Superchain participants
  begin their own programs. 


  The selected contributor will deliver a comprehensive report covering structural differences,
  common pitfalls, success metrics, and actionable recommendations for Optimism’s governance. 


  This is a Delegate Mission Request with a fixed 20,000 OP grant. Applications are open to any
  individual or team.
