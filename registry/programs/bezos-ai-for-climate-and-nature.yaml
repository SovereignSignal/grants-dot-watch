summary: >
  A $100 million Bezos Earth Fund initiative funding projects that apply AI
  to sustainable proteins, power grid optimization, and biodiversity
  conservation. It runs in two phases: Phase I seed grants of $50,000 to up
  to 30 grantees (submissions closed August 13, 2024), followed by Phase II
  implementation grants of up to $2 million to 15 grantees. Eligible
  applicants include US-based 501(c)(3) nonprofits and academic institutions
  globally.
