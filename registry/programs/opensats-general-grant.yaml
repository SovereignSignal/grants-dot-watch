summary: OpenSats General Grants support free and open-source work benefiting Bitcoin and related
  ecosystems. Applications are accepted in the first two months of each quarter and closed in March,
  June, September and December. General grants run for 3 to 12 months; budgets are denominated in
  USD and grants are payable in bitcoin. No fixed individual award range is stated.
