summary: "ARIA's £88.5m Robot Dexterity programme has an open Request for Proposal on standards and
  benchmarks for dexterous robotics: benchmarks, standards, interfaces and shared testing
  infrastructure that make dexterous robots easier to develop and deploy, with tactile data
  standards a particular priority. Teams may request up to £3 million each; international partners
  are welcome. Proposals (a PDF of no more than five pages plus references) go through ARIA's
  application portal by 1 December 2026, 13:00 GMT."
