summary: >
  The Scroll Forum has opened applications for DCP 1 - State of Scroll Research, a pilot under the
  Delegates Contribution Program, with a total budget of 18,000 USDC for an 8-10 week project
  targeting a deadline of May 31, 2026. Roles include Data & Analytics (5,000 USDC), Format &
  Visualization (2,000 USDC), and Regional Researchers & Storytellers (2,200 USDC per region) focusing
  on regions like LATAM, Europe, Africa, Southeast Asia, and APAC.
