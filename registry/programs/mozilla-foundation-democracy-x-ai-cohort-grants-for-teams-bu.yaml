summary: 'Mozilla Foundation — Democracy x AI Cohort is offering $50,000 initial grants to approximately
  10 teams building open-source AI tools that protect democracy. Selected teams receive 12 months of funding
  and may become eligible for an additional $250,000, for a maximum of $300,000 total. Initial proposals
  are due March 16, 2026. Projects must have functional technology, a committed team, and a clear commitment
  to openness, including some code open-sourced or a public roadmap during the grant period.'
