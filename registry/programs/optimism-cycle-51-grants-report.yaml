summary: The Optimism Grants Council reviewed 3 applications during Cycle 51, conditionally
  approving 1 and declining 2. Bedrock received conditional approval for 300,000 OP, while Origin
  Protocol (206,970 OP requested) and Pivot Bot (100,000 OP requested) were both declined. Total OP
  requested across all Growth Apps this cycle was 606,970 OP, with 300,000 OP actually granted.
  Season 9's remaining budget stands at 2,740,000 OP after this cycle's allocations.
