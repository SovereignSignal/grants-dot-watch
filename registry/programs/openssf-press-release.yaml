summary: >-
  OpenSSF Press Release announces $12.5 million in grant funding from leading organizations to
  advance open source security. The Linux Foundation is distributing the funds to support critical
  security initiatives across the open source ecosystem. 


  This funding round is now open for proposals focused on improving the security of widely used open
  source projects and infrastructure.
