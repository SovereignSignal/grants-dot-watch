summary: "Microsoft's AI Economy Institute (AIEI) funds independent, policy-relevant research
  through its fourth global call, 'AI and Jobs: designing for augmented work', on the organizational
  choices that decide whether AI augments or substitutes for human work. Each selected proposal
  receives a single $75,000 research grant plus a travel allowance; up to two PIs from accredited
  universities or research institutions worldwide, each with a PhD or equivalent held for at least
  three years. The portal opened October 19, 2026; proposals are due November 30, 2026 (6:00 PM
  Pacific)."
