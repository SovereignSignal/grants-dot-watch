summary: "ORCID's Global Participation Fund gives annual competitive grants to non-profits, NGOs and
  government agencies in Global South focus communities, in two tracks: Community Development and
  Outreach, and Technical Integration, which funds software development to build and update ORCID
  integrations in open-source systems. Proposals do not require ORCID membership. The current cycle
  is open through 31 October."
