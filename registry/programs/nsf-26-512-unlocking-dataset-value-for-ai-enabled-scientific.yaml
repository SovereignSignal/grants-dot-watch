summary: Apply to NSF's brand-new cross-directorate solicitation (announced July 21, 2026, 9 days
  ago) that funds projects making existing scientific datasets AI-ready for automated analysis and
  discovery, with 25–50 awards across three tiers — Planning (≤$200K), Impact (≤$2M), and Flagship
  (≤$5M) — supporting feature extraction, metadata generation, data-pipeline construction, and
  dataset harmonization across any scientific domain. Eligible applicants include universities,
  nonprofits, for-profit companies, state and local governments, and tribal nations, with no
  per-organization proposal cap and Novem
