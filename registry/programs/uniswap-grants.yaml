summary: >
  Provides grants and support to teams building the Uniswap Protocol and the
  broader DeFi/onchain economy, funding projects across protocols, tooling,
  research, governance, security, and community initiatives. Published grants
  include governance upgrade audits, the Uniswap Hook Incubator, the v4 Hooks
  Registry, developer docs, a security fund, and research on incentive
  optimization and optimal routing; funding is scoped to project needs, with
  technical and ecosystem support provided alongside.
