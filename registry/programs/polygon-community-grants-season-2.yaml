summary: >
  Season 2 of the Polygon Community Grants Program made up to 35M POL available to
  fund builders on Polygon, split between a Grant Allocators Track (up to 15M POL,
  themed around AI, DePIN, and memecoins via independent allocators like Gitcoin,
  IoTeX, and Eliza Labs) and a Direct Track (up to 20M POL for any category). KYC was
  mandatory and funding was milestone-based. The program now shows as closed on
  Questbook.
