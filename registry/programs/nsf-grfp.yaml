summary: >
  Annual U.S. National Science Foundation competition awarding roughly 2,500
  fellowships per year to outstanding STEM graduate students, providing three
  years of a $37k stipend plus a $16k education allowance, usable over five years.
  Applications, reviews, and awards are handled by a dedicated GRFP Operations
  Center; the 2026 awards were announced in April 2026 from around 14,000
  applicants.
