summary: >
  Annual cohort-based grants of $50,000-$100,000 for one year to youth-led
  and intergenerationally-led U.S. organizations working on responsible
  technology, with young leaders holding funding-decision roles. The 2023
  and 2025 cohorts were anchored by Omidyar Network; Fund 3 applications
  closed October 10, 2025 and Fund 4 is expected to open in Fall 2026.
