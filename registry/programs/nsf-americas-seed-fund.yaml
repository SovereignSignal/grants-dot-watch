summary: >
  Non-dilutive R&D funding for U.S. deep-tech startups: Phase I awards up to $305k, Phase II up to
  $1.25M, with Fast-Track options, reaching roughly 400 companies and $200M+ deployed per year. A
  Distributed Ledger topic explicitly covers blockchain, DAGs, cryptography, and smart contracts;
  applications begin with a Project Pitch, followed by invitation to a full proposal and merit
  review by program directors.
