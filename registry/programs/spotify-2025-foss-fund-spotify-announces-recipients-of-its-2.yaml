summary: >-
  **Spotify 2025 FOSS Fund** has announced its 2025 recipients, awarding financial support to three
  open source projects focused on tools and libraries for audio, video, and digital experiences. 


  The fund provides direct grants to maintainers of projects that power Spotify’s infrastructure and
  broader open source ecosystem. Specific project names and grant amounts are listed in the official
  announcement. 


  This is the latest cycle of Spotify’s ongoing FOSS Fund program.
