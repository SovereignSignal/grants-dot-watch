summary: >
  Long-term fellowship scheme supporting early-career natural scientists building
  independent research careers in the UK or Republic of Ireland. The Royal Society
  operates the selection process and publishes historical eligible-application and
  offer counts. Institutional funding partners vary by location and award; the
  operator must not be assumed to be the sole capital source.
