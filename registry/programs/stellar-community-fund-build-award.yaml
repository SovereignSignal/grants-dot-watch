summary: >
  The Stellar Community Fund's primary award, funding teams building on the
  Stellar network with up to $150,000 in XLM per project across three tracks:
  Open (brand-new projects), Integration (existing Stellar building blocks or
  teams with significant traction), and RFP (tooling/services matching an
  open SCF RFP). Runs in numbered rounds; new applicants start with an
  interest form reviewed on a rolling basis, and selected teams complete
  KYC/KYB.
