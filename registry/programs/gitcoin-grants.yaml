status: paused
mechanism: quadratic
summary: >
  A seasonal public-goods funding program (running since 2019) that lets the crypto community fund
  open-source and ecosystem projects. GG24 (Gitcoin 3.0, ~$1.8M, October 2025) is complete. GG25 has
  been discussed in governance but has no open application window as of 2026-08-29. Grants Stack
  Builder (builder.gitcoin.co) is offline.
