status: active
mechanism: quadratic
apply_url: https://builder.gitcoin.co
summary: >
  A quarterly public-goods funding program (running since 2019) that lets the crypto community fund
  open-source and ecosystem projects, using Quadratic Funding to amplify many small donations from a
  matching pool. Recent rounds organize funding into domains -- developer tooling, interop
  standards, public goods R&D, privacy -- under a Domain Allocator model, alongside retro rounds for
  mature builders.
