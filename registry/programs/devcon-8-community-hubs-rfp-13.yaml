summary: Ethereum Foundation's Devcon team is accepting proposals through August 12, 2026 for
  community groups to run free, topic-focused programming hubs inside Devcon 8 (Mumbai, November
  3-6, 2026). Selected hubs receive a free ~48 m2 in-venue space, a dedicated stage session, and up
  to 5 Devcon tickets; proposals must center on a single Ethereum, open-source, or CROPS theme with
  no token marketing.
