summary: >
  OpenSSF project that funds security work on critical open-source projects,
  foundations, and ecosystem services that use an OSI-approved license.
  Applications follow a four-quarter seasonal calendar: submissions in
  January, April, July, and October, then a month of co-design and a month
  of decision and disbursement. Recipients publish monthly reports and join
  monthly strategy roundtables. A March 2026 coalition investment of $12.5
  million is managed with OpenSSF; Alpha-Omega reports more than 70 grants
  totaling over $20 million.
