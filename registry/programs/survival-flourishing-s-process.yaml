summary: >
  The Survival and Flourishing Fund's recurring grant rounds, run once or twice per year via the
  S-Process algorithm and meeting procedure, recommend donations to organizations working on the
  long-term survival and flourishing of sentient life, including existential and global catastrophic
  risk reduction. A rolling Speculation Grant application runs year-round; a Speculation Grant
  guarantees eligibility for consideration in an S-Process round.
