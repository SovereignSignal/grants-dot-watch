summary: >
  An Arbitrum DAO grants program administered via Questbook in which
  community-elected domain allocators distribute milestone-based grants to
  projects building on Arbitrum across domains such as developer tooling,
  education, gaming, and new protocols and ideas. Allocators are elected
  quarterly and funding is approved on a rolling basis within each domain;
  later rounds run as Arbitrum DDA seasons on Questbook.
