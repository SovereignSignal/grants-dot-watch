summary: Uniswap Foundation Security Fund (UFSF) subsidizes up to 100% of audit costs for projects
  building in the Uniswap ecosystem, including Uniswap v4. Selected projects also receive a
  pre-audit security scan and access to the Areta-powered curated auditor marketplace. The October
  2026 cohort closed October 7 at 23:59 UTC. Later cohorts require a separate published call; the
  program remains active.
