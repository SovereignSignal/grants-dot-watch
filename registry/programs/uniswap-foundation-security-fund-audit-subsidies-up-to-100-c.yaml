summary: "Uniswap Foundation Security Fund (UFSF) subsidizes up to 100% of audit costs for projects
  building in the Uniswap ecosystem, including Uniswap v4. Selected projects also get a pre-audit
  security scan and access to the Areta-powered curated auditor marketplace. UFSF runs monthly
  application cohorts: each month's window closes (September 2026 cohort closed September 7; October
  2026 cohort closes October 7, 2026, 23:59 UTC) while the program stays open. Apply at
  areta.fillout.com/ufsf-projects."
