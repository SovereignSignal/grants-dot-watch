summary: >
  Coinbase Developer Platform's grant program for developers building real,
  user-facing onchain applications using CDP tools (Wallets, AgentKit, the
  CDP SDK, Onramp, and the Swap API). Runs in quarterly/seasonal rounds
  ($3,000-$10,000 per grant, ~$30,000 per round); a project must be at MVP
  stage with a public demo video. CDP also funded prize tracks at the
  "Agents in Action" hackathon (Best Use of x402 + CDP Wallet, Best Use of
  CDP Wallet, Best Use of x402), each with 1st/2nd/3rd place awards.
