summary: >
  The Future of Life Institute's grantmaking, which funds research and
  projects reducing large-scale risks from powerful technologies -- advanced
  AI safety and governance, biotechnology/bio-risk, and nuclear weapons --
  via targeted Requests for Proposals and Contests published on a regular but
  irregular basis. FLI does not accept unsolicited requests; applicants must
  respond to an open RFP, Contest, or fellowship call.
