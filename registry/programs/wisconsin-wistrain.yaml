summary: >
  Employer-led workforce training grant program from the Wisconsin Department
  of Workforce Development, focused on advanced manufacturing and artificial
  intelligence. Grants of up to $330,000 per grantee or consortium fund
  employer-driven occupational training, open to employers of any size
  operating in Wisconsin; after the initial deadline, applications may be
  reviewed on a rolling basis until funds are awarded.
