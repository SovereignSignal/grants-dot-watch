summary: Apply for up to €50,000 for open technology projects benefiting research networks and
  higher-education institutions, in a co-fund between NLnet and the Vietsch Foundation. Eligible
  projects include federated academic infrastructure, open educational tools, and research-network
  protocols such as eduVPN. The fund updated its deadline sequence on August 3, 2026 and reopens
  September 3 with a November 3 deadline — a lesser-known NLnet sub-fund not part of the Open
  Internet Stack trio.
