summary: >
  EIC Accelerator supports high-risk, market-creating innovations from startups and SMEs through
  grants below EUR 2.5 million, optional equity investments of EUR 1-10 million, and business
  acceleration support. Short proposals are accepted continuously and full proposals use
  scheduled 2026 batching dates on 7 Jan, 4 Mar, 6 May, 8 Jul, 2 Sep, and 4 Nov.
