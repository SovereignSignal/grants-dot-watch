summary: >
  Hi everyone, My name is Oluwatobi Femi and I am building DeFiState. DeFiState is an open
  infrastructure project for producing block-synchronized streams of DeFi protocol state on EVM
  chains. The system aggregates data from protocol indexers and exposes the resulting state through a
  JSON-RPC interface, enabling applications to consume real-time DeFi state using a simple
  subscription.
