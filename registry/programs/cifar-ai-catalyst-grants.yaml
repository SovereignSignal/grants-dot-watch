summary: CIFAR program providing short-term, flexible funding to catalyze new interdisciplinary
  machine-learning research collaborations across domains including AI safety and alignment,
  misinformation/information integrity, trustworthy and interpretable LLMs, real-world
  deployed-system safety, AI auditing and fairness, and privacy-preserving techniques. Awards have
  run annually since at least 2020; a recent call funded the program's first AI-safety-specific
  Catalyst Grants under the national strategy. Apply by contacting CIFAR directly; no standing
  application URL found.
