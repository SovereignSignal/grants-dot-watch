summary: >
  The Frontier Model Forum's AI Safety Fund awards grants to independent
  researchers at academic institutions, research institutions, NGOs, and
  mission-driven for-profits, for research addressing critical safety and
  security risks of frontier AI models and enabling standardized
  third-party evaluations. Proposed budgets are capped at $500,000 per
  grant, and rounds run as periodic competitive RFPs rather than rolling
  applications.
