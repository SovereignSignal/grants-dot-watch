summary: The Arbitrum Foundation has proposed requesting $16M in USD (RWAs), 1.7k ETH, and 230
  million ARB to fund its continued operations for an additional year beyond its initial AIP 1.1
  allocation. Technical costs are expected to represent 54% of all anticipated expenses for 2027,
  covering costs associated with Arbitrum One and Arbitrum Nova. The Foundation operates as an
  intentionally structured cost center that absorbs growth and development costs while enabling
  ecosystem expansion, with all revenue accruing directly to the DAO treasury. The long-term goal is
  expanding DAO revenue across multiple
