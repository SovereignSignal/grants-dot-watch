summary: Tether's developer grants program funds local-first AI and payments infrastructure built on QVAC
  and Tether's open-source Wallet Development Kit (WDK), with task-based awards of roughly $1,500-$4,000
  paid in USD₮ or Bitcoin. Open tasks include wallet infrastructure, browser extensions, and e-commerce
  integrations; there is no cap on total payouts. Applications go through the QVAC platform.
