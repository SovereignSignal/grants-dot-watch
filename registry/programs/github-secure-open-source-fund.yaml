id: github-secure-open-source-fund
name: GitHub Secure Open Source Fund
org: github
parent: null
systems: [oss-sustainability]
wires: [oss]
status: active
mechanism: grants
apply_url: https://docs.google.com/forms/d/e/1FAIpQLScDBalom0XhmJrvyI3kwD7dZ-dD4_uhmLNysVXtA8fH_WUKoA/viewform
summary: >
  A GitHub program investing in the security of critical open source
  projects: each accepted project receives $10,000 ($6,000 during the
  program, $2,000 at the 6-month check-in, $2,000 at the 12-month check-in)
  paired with a 3-week security education program and expert support. Open to
  current maintainers (individual or teams of up to 3) of projects with a
  valid open source license, community adoption, and established governance;
  applications are rolling and considered for upcoming sessions.
rounds:
  - name: Sessions 1 and 2
    status: deployed
    source: https://github.blog/open-source/maintainers/securing-the-supply-chain-at-scale-starting-with-71-important-open-source-projects/
  - name: Session 3
    status: deployed
    source: https://github.blog/open-source/maintainers/securing-the-ai-software-supply-chain-security-results-across-67-open-source-projects/
sources:
