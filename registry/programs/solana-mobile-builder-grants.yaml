summary: >-
  **Solana Mobile Builder Grants** offers rolling funding for developers building apps, tools, and
  Saga Seeker-integrated products on the Solana Mobile ecosystem. 


  The program provides grants, technical guidance, and marketing support to help selected teams
  launch on the dApp Store. It operates through two tracks: open Builder Grants and targeted RFPs. 


  Applications are accepted on a rolling basis with no fixed deadline.
