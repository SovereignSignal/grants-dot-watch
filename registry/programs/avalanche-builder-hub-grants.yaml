summary: >-
  **Avalanche Builder Hub Grants** offers funding to developers and teams building on the Avalanche
  network. The program supports projects across multiple categories with grants ranging from $10,000
  to $500,000, depending on scope and stage. 


  Eligible applicants include developers, startups, and organizations creating applications,
  infrastructure, or tools on Avalanche. Applications are accepted on a rolling basis through the
  Avalanche Builder Hub portal.
