summary: >
  NSF PESOSE invites proposals to translate open-source research into sustainable, secure ecosystems
  that address national and societal needs — scoping, establishing, and improving the safety, security,
  and privacy of open-source projects. Full proposals are due the first Tuesday in September and the
  first Tuesday in March, annually. Total program funding is approximately $40 million.
