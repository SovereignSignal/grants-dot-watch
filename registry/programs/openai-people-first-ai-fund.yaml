summary: >
  A $50 million fund for 2026 from the OpenAI Foundation making unrestricted,
  one-time grants to US 501(c)(3) nonprofits with annual budgets between
  $500,000 and $10 million (priority $1-8 million; select regranters under
  $15 million), across community support services, community arts and
  cultural organizations, and community journalism and media. Grants run up
  to 10% of an organization's annual budget with light-touch reporting, and
  do not require use of OpenAI products.
