summary: >
  The Mozilla Technology Fund (MTF) gives awards of up to $50,000 plus a 12-month
  mentorship cohort to open-source projects tackling a themed public-interest
  technology challenge each round. Awardees join monthly calls with Mozilla fellow
  mentors; project outputs must be open source.
