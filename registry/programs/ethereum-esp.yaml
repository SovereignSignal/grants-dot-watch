summary: The Ethereum Foundation's primary direct grants program, supporting free and open-source projects,
  builder tools, infrastructure, and research that strengthen Ethereum's technical, social, and research
  foundations. After pausing unsolicited open grants in August 2025, ESP relaunched in November 2025
  as a Wishlist and Requests-for-Proposals program. Applicants apply against posted items; time-limited
  open rounds are a separate, currently empty track. Quarterly allocation reports break awards into
  community and education, cryptography and zero-knowledge proofs, developer tooling, consensus and
  execution layers, and application infrastructure.
