summary: >
  A Knight Foundation challenge series that funded ideas at the intersection
  of journalism, technology, and civic information, with themed editions
  including Libraries, Data, and Open Gov. Each edition selected full-award
  winners alongside smaller Prototype Fund awards; software developed with
  News Challenge grant funds had to be released open source. Sources for its
  editions now live on the foundation's legacy site.
