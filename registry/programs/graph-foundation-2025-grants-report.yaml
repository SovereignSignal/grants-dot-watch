summary: The Graph Foundation released its 2025 Annual Grants Report, detailing strategic
  investments that marked a transformative year for The Graph protocol. The grants program supported
  five R&D teams in delivering Horizon and building infrastructure that processed billions of
  queries in 2025. Key achievements include advancing Token API to production, integrating AI-native
  tooling via Subgraph MCP, and expanding multi-chain coverage, with lifetime funding surpassing
  $16.8M. The report emphasizes a disciplined focus on high-impact initiatives for protocol
  development and adoption.
