summary: >
  An NLnet-managed fund within the EU Next Generation Internet initiative awarding small-to-medium
  R&D grants (EUR 5,000-50,000 for first proposals) to deliver, mature, and scale new internet
  commons across the full technology stack, from libre silicon and P2P infrastructure to middleware
  and end-user applications. Calls run on a rolling basis until the EUR 21.6 million programme
  budget (through 2027) is fully allocated.
