summary: >
  An NLnet-managed fund within the EU Next Generation Internet initiative that awarded
  small-to-medium R&D grants (EUR 5,000-50,000 for first proposals) to deliver, mature,
  and scale new internet commons across the full technology stack. NLnet published the
  thirteenth call as the fund's final intake; no further applications are sought.
