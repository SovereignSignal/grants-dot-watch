apply_url: https://events.linuxfoundation.org/open-source-summit-europe/attend/scholarships-travel-funding/
summary: >
  Event registration scholarships that award a complimentary pass to people
  who could not otherwise attend Linux Foundation events. Reviewers select
  from two tracks: applicants from traditionally underrepresented or
  marginalized groups, and active open-source community members who cannot
  get employer funding. Recipients may receive up to two scholarships per
  calendar year; travel is a separate Travel Fund application.
