summary: >
  Web3 Foundation's open grants program, which funded open-source software
  development and research around Polkadot, Kusama, Substrate, and ink! in
  quarterly waves. Historical levels ran from Level 1 (up to $10,000) to
  Level 3 (unlimited), with at least 50% typically paid in vested DOT. The
  program has been discontinued and no longer accepts applications, in favor
  of Targeted Strategic Funding and the Decentralized Futures program.
