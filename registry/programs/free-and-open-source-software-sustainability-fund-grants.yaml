summary: >
  OTF's fund for the sustainability of free and open source software used for internet freedom,
  making targeted awards (from $7k/month up to $400k over 24 months) for maintenance,
  interoperability, security, and resilience of FOSS tools. Awards run through a two-stage
  competitive process (concept note, then proposal with advisory council review) as
  deliverable-based performance contracts; supported projects include F-Droid, DEfO, and Mailvelope,
  and an application round ran March-May 2026.
