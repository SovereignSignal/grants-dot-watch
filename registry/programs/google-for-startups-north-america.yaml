summary: >
  A ten-week, equity-free accelerator for North American pre-seed through Series A startups using AI
  in energy systems. The 2026 cohort focuses on grid optimization, demand flexibility, energy
  affordability, and carbon-aware infrastructure, with Google mentorship, technical support, product
  access, and eligible cloud credits. Applications closed June 30, 2026.
