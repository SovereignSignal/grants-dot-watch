summary: >-
  **Scroll Sequencer Fees Fund Competitive Grants Program** invites applications for grants funded
  by sequencer fees. The program allocates a percentage of Scroll’s sequencer revenue to support
  public goods, ecosystem projects, and talent attraction initiatives, with primary focus on grant
  programs and secondary interest in venture studios and treasury management. 


  Proposals must be submitted via the Scroll forum. The fund is open to builders and teams
  contributing to Scroll’s growth and long-term sustainability.
