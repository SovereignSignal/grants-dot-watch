summary: Tarbell Center for AI Journalism launched a new $10M Institutional Grants program on Oct 5,
  2026, with grants of $50,000 to $500,000+ per grant for newsrooms, media ventures and series
  focused on AI. It aims to distribute at least $10M by the end of 2027. NPR's Power and Influence
  team ($250,000) and Machine Gods are the first recipients. Editorial decisions remain with
  recipients. Applications for this round close December 11, 2026. Apply at
