summary: >
  The Sloan Foundation's Digital Technology program funds the tools, norms, and
  institutions that sustain open-source software, hardware, and models in research.
  Its Open Source in Science line funds university Open Source Program Office (OSPO)
  grants (up to $750,000 over two years), publication/archiving infrastructure, and
  research-software career paths; prospective applicants submit a two-page letter of
  inquiry. Recorded sub-lines include "Better Software for Science" (13 grants) and
  "Exploratory Grantmaking in Technology" (8 grants).
