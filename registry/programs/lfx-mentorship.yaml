apply_url: https://mentorship.lfx.linuxfoundation.org/
summary: >-
  Recurring Linux Foundation mentorship connecting new contributors with project maintainers on a
  defined deliverable. Full-time terms run spring (March–May), summer (June–August), and fall
  (September–November); mentees apply on the LFX platform to at most three projects per term.
  Participating projects may offer educational stipends on a purchasing-power-parity schedule; terms
  starting July 1, 2026 use a $1,000 minimum and $6,600 maximum.


  Stipends now purchasing-power-adjusted, USD 1,000-6,600, effective July 1, 2026 for new programs
