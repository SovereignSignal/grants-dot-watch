summary: >
  Annual Linux Foundation Education scholarship that awards free training
  courses and a certification exam to increase diversity in open source.
  The 2026 round selected more than 500 recipients from 123 countries across
  16 categories after more than 5,900 applications; more than 4,250
  scholarships have been awarded since 2010. The 2027 cycle opens in April 2027.
