summary: >
  The funding channel through which OpenSSF allocates resources for audits,
  technical writers, interns, and other needs across its technical
  initiatives, working groups, and projects. Its defined request process
  includes tiers up to $70,000–$150,000. A separate $12.5 million coalition
  investment announced in March 2026 supplies OpenSSF and Alpha-Omega with
  capital for sustainable open source security work; it is not a standalone
  public application round.
