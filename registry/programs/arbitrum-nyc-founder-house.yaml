summary: Arbitrum is hosting the NYC Founder House, an in-person builder experience starting March 6 for
  early-stage teams. The program offers up to $340,000 in prizes and grants, hands-on mentorship in product,
  infrastructure, and go-to-market strategies, and access to ecosystem leaders like Robinhood and Alchemy.
  It targets teams building in AI, DeFi, or any onchain vertical aiming to launch on Arbitrum mainnet.
  Applications are open with a deadline approaching in 3 days from the announcement date.
