summary: 'NSF AI Funding Opportunities announces multiple active solicitations for AI research, infrastructure,
  education, and workforce development. These include the National AI Research Resource Operating Collaborative
  (NAIRR-OC), CyberAI Scholarship for Service (SFS) program, and general AI research infrastructure grants.
  Funding supports academic institutions and researchers pursuing interdisciplinary AI projects and cybersecurity-focused
  AI training. Deadlines and award amounts vary by specific solicitation. Full details are available at
  https://www.nsf.gov/focus-areas/ai.'
