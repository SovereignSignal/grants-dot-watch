summary: >
  Coefficient Giving's (formerly Open Philanthropy) fund supporting technical
  AI safety research, AI governance and policy, and capacity-building to grow
  the field. Published grants include general support for organizations,
  compute funds for AI safety research, and individual research projects such
  as studies on model organisms of reward-hacking, chain-of-thought
  faithfulness, latent adversarial training, and software formal
  verification.
