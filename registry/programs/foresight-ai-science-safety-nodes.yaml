summary: >
  Funds AI-first projects that use artificial intelligence as the primary engine for progress in
  science and safety, combining grant funding ($10,000-$100,000, higher for AI safety-oriented
  areas) with office space and compute at hubs in San Francisco and Berlin. Applications are rolling
  with a deadline on the last day of every month and decisions within 8-12 weeks; applicants are
  strongly expected to be active in-person members at a hub. The program lists 79 previously funded
  projects and six 2026 grantees.
