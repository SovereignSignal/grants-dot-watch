summary: >-
  Overview


  Strategic Animal Funding Circle (SAFC) is a group of donors looking to support cost-effective and
  high-impact animal welfare and protection nonprofits, particularly during a critical growth phase
  where targeted funding can have a significant impact. Twice a year, donors in the circle grant a
  total of ±$500k divided among the most promising applicants, with a typical grant size of $50k.
