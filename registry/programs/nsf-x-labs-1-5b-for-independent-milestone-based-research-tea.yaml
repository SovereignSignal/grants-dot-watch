summary: >
  NSF X-Labs is a planned $1.5 billion initiative for large, multiyear awards to independent,
  full-time research and development teams pursuing technical breakthroughs outside traditional
  university and industry-lab structures. The first two topic announcements closed in July 2026.
  Scientific Instrumentation for Sensing and Imaging proposals were due 13 July 2026. Quantum
  Systems interconnects and integrated photonics proposals were due 24 July 2026. NSF has said
  additional topics will be announced.
