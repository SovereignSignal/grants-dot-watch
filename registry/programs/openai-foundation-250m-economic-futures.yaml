summary: 'The OpenAI Foundation is committing an initial $250M to grants, partnerships, and direct work
  aimed at building secure and abundant economic futures in the age of AI. The program will work across
  three areas: investing in independent measurement and forecasting of AI''s economic impacts, resourcing
  workers and communities through near-term disruption, and supporting new approaches to sharing economic
  gains broadly. The Foundation is also inviting public input on what people are seeing in their work
  and economic lives to inform the program''s direction. The announcement was published on May 27, 2'
