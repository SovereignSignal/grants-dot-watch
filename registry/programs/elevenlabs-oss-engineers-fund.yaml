summary: >
  A recurring internal-nomination fund supporting open-source projects that ElevenLabs engineers use
  in their work. Every six months, engineers nominate projects and the company distributes direct
  monthly support across maintainers and projects in audio, web infrastructure, testing, rendering,
  developer tooling, and language ecosystems.
