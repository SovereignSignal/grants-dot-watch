summary: >
  The Solana Foundation Grants program funds projects that generate public goods for
  the Solana ecosystem via milestone-based traditional grants, convertible grants
  (which convert to investment on hitting milestones), and RFPs, across DeFi, DePIN,
  games, NFTs, and core open-source infrastructure. Applications are reviewed on a
  rolling basis (review ~1 week, decision ~3 weeks).
