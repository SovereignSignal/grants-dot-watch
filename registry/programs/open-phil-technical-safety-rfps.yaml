summary: >-
  Open Phil Technical Safety RFPs offers over $40 million in funding for technical AI safety
  research. The program invites proposals from AI safety researchers worldwide with no specified
  deadlines or eligibility restrictions beyond relevance to technical safety work. 


  Researchers can submit proposals for projects addressing core challenges in AI alignment and
  safety. This represents one of the largest current funding pools dedicated specifically to
  technical AI safety.
