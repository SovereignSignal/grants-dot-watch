summary: "**Google.org Impact Challenge: AI for Science** is offering $30 million in grants for
  nonprofits, social enterprises, and academic institutions. The program funds AI projects that
  accelerate breakthroughs in health and life sciences or climate and environmental science, with
  individual grants ranging from $500K to $3M. Selected teams may also join the Google.org
  Accelerator for technical support and Cloud credits. Applications are due by April 17, 2026."
