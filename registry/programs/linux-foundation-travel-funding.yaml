id: linux-foundation-travel-funding
name: Linux Foundation Travel Fund
org: linux-foundation
parent: null
systems: [oss-sustainability]
wires:
  - oss
status: active
mechanism: grants
apply_url: https://events.linuxfoundation.org/about/travel-fund-request/
summary: >
  Standing travel fund for open-source developers and community members who
  could not otherwise attend Linux Foundation events, with emphasis on
  historically underrepresented groups and people of lower socioeconomic
  status. Approved support covers coach airfare, ground transport to and from
  the airport, and lodging for the event dates plus one prior night.
  Applications are submitted from the LF Individual Dashboard; each event
  sets its own deadline.
