summary: >-
  Optimism Governance Fund is accepting proposals for Season 9 Missions. 


  The program will distribute up to 2.4 million OP across four mission categories through the
  Optimism Collective’s Governance Fund. Any individual or team may submit a mission proposal on the
  Optimism Governance Forum by the deadline of June 17, 2025. Successful missions will be voted on
  by token holders and funded from the Governance Fund if approved.
