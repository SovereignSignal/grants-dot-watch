summary: >
  AWS Imagine Grant is an annual program for registered nonprofits using cloud technology to advance
  their missions. The 2026 U.S. cycle offers three award categories, including up to $200,000 in
  unrestricted support and $100,000 in AWS credits for the Pathfinder Award. Public applications closed
  June 5 and the selection process continues through December 2026.
