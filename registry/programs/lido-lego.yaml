summary: LEGO (Lido Ecosystem Grants Organisation) funds individuals and projects benefiting the Lido
  protocol and broader Ethereum PoS/DeFi ecosystem, via a tiered structure (Sandgrain up to $1,000; Pebble
  up to $10,000; Boulder up to $100,000; Mountain $100,000+) overseen by an 8-member LEGO Council with
  domain-specific tracks. Applicants pitch a committee member directly rather than through an open-form
  apply page.
