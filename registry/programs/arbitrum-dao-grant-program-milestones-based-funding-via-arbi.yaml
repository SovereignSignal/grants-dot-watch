summary: >-
  **Arbitrum DAO Grant Program** offers milestones-based funding to builders, dApps, technical
  infrastructure projects, adoption initiatives, and community growth efforts on Arbitrum chains. 


  The program operates on a rolling deadline with no fixed application window. Grants are approved
  and disbursed through the Arbitrum DAO governance process. 


  Eligible applicants include teams building directly on Arbitrum One or Arbitrum Nova.
