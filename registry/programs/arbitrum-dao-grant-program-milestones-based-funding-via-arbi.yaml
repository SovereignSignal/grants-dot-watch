summary: Arbitrum DAO Grant Program offers milestone-based funding to builders, dApps, technical infrastructure
  projects, adoption initiatives, and community growth efforts on Arbitrum One and Arbitrum Nova. The
  program runs on a rolling deadline with no fixed application window; grants are approved and disbursed
  through Arbitrum DAO governance. Season 3, the program's current one-year phase, is divided into five
  domains led by Domain Allocators who distribute funds across predefined focus areas.
