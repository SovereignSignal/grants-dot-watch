profile: >
  Flow is a layer-1 blockchain built for consumer-scale apps, NFTs, and
  gaming, governed and funded primarily through the Flow Foundation. The
  Foundation runs two parallel programmes: GrantDAO, a community-voted
  (MACI voting on DoraHacks) fund for pre-startup and hackathon-stage
  builders, and Ecosystem Grants, a top-down programme for growth-stage
  teams reviewed internally by the Foundation against milestones and
  roadmaps. GrantDAO Round 1 closed August 2025 with Round 2 following in
  early 2026.
