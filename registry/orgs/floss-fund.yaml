profile: >
  FLOSS/fund is a $1M-per-year fund backed by Zerodha that makes no-strings-attached grants
  to free and open source software projects worldwide. Projects apply by publishing a
  funding.json manifest and submitting it to the fund's public directory (dir.floss.fund),
  where applications are also indexed for other prospective sponsors. It distributes in
  tranches — the first in May 2025 and a second in October 2025 — with disbursements
  published transparently.
