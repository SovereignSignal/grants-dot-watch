profile: >
  Horizon Europe is the European Union's research and innovation framework programme,
  administered by the European Commission. Funding is awarded through competitive calls
  published on the EU Funding and Tenders portal, spanning topics that include AI and open
  internet infrastructure — for example the Web 4.0 Architectural Framework and Open
  Internet Stack topic (HORIZON-CL4-2026-04-HUMAN-02), which closed in April 2026.
