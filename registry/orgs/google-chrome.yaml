profile: >
  The Google Chrome team funds open-source web-platform work through
  targeted funds fiscally hosted by Open Source Collective, including the
  Advanced Apps Fund and the Web Framework & Tools Performance Fund. The
  Web Framework & Tools Performance Fund backs projects that improve
  framework and tooling performance (bundle size, progressive delivery,
  meta-framework and build-tool improvements) and remained active into
  2026, with over $2.2M contributed and 18 expenses paid as of the most
  recent review.
