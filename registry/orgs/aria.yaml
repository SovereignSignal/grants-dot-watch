socials:
  x: https://x.com/ARIA_Research
status: active
profile: >
  ARIA is the UK government's independent research and development funding
  agency, modeled on DARPA, backing high-risk, high-reward programmes in
  areas including AI safety, AI scientists, and other scientific and
  technological breakthroughs. It funds through solicited programme calls
  and virtual institutes rather than open, unsolicited proposals, and
  continues to issue new calls and awards across AI- and OSS-adjacent
  domains.
funding:
  focus:
    - AI safety
    - AI scientists / scientific discovery tools
    - high-risk, high-reward R&D
  apply_url: https://www.aria.org.uk/
