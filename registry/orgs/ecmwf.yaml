profile: >
  ECMWF (European Centre for Medium-Range Weather Forecasts) is an
  intergovernmental organization providing global medium-range weather
  forecasts, atmospheric monitoring, and data services under EU programs
  like Copernicus and Destination Earth. It runs open innovation through
  Code for Earth and Summer of Weather Code challenges to drive open source
  development and partnerships, but has no traditional grant funding
  programs, focusing instead on data licensing, workshops, and
  collaborative research with member states, WMO, and scientists.
sources:
