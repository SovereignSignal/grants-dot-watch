profile: >
  The Drupal Association is the non-profit focused on accelerating the
  Drupal open source project, fostering its community, and maintaining the
  Drupal.org infrastructure. It organizes DrupalCon and funds its work
  through sponsorships, organizational Sustaining Members, and the Ripple
  Makers individual membership program rather than traditional
  grant-making. The site was active as of 2026, with a 2025 impact report
  and 2026 board election announcements.
