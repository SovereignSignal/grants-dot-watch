profile: >
  The U.S. Department of Education administers extensive discretionary grant
  programs across K-12, higher education, and innovation, recently prioritizing AI
  literacy, ethical use of AI, teacher preparation, and related capacity building.
  It has allocated tens of millions of dollars specifically to AI in education
  priorities, including $50M in one FIPSE competition, with formalized rules
  effective 2026; programs operate through federal processes with broad
  eligibility.
