profile: >
  Charitable foundation that funds research around the world, across a broad range of disciplines,
  to understand life, health and wellbeing and to deliver equitable health solutions. Funding runs
  through published schemes: applicants find an opportunity via its funding finder, follow published
  funding guidance and policies, and apply through the Wellcome Funding portal. It also works with
  communities, governments and partners to advocate for evidence-based health policies.
