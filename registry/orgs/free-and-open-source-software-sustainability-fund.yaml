profile: >
  The Free and Open Source Software Sustainability Fund is run by the Open
  Technology Fund (OTF), a Washington DC-based 501(c)(3) supporting internet
  freedom technology worldwide. The fund makes targeted awards (from $7k/month
  up to $400k over 24 months) for maintenance, interoperability, security,
  and resilience of internet-freedom FOSS tools, via a two-stage competitive
  process (concept notes to proposals, advisory council review, performance
  contracts) with complementary lab support. OTF administers deliverable-based
  contracts rather than lump-sum grants; a March-May 2026 application round
  ran recently, and OTF's broader funds (such as the Internet Freedom Fund)
  accept concept notes on a rolling basis.
funding:
  focus:
