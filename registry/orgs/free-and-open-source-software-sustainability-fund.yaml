profile: Open Technology Fund (OTF) is an independent nonprofit advancing global internet freedom by
  supporting technology that counters censorship and surveillance. Its programs include the Internet
  Freedom Fund, Rapid Response Fund and FOSS Sustainability Fund, alongside resource labs. The FOSS
  Sustainability Fund is one OTF program; it is not the organization itself. Service-provider
  procurements have separate terms and deadlines from requests for emergency assistance.
