    - censorship circumvention
    - digital security
    - privacy
    - anti-surveillance
    - secure communications
    - applied research
    - human rights tech
  typical_size: >
    $10,000-$900,000 (most requests $50,000-$200,000)
  cadence: >
    Rolling -- concept notes accepted on an ongoing basis for the Internet
    Freedom Fund; Rapid Response Fund reviewed within ~5 days.
  apply_url: https://apply.opentech.fund/
