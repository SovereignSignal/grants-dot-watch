profile: >
  MATS is an independent research fellowship that connects researchers with mentors in AI alignment,
  transparency, and security. The main program runs 10 weeks with an optional 6-12 month extension,
  and provides a $1,250 weekly stipend, a $2,000-per-week compute budget, housing, meals, and office
  space in Berkeley and London. Over 527 researchers have participated since late 2021, producing
  more than 200 research papers.
