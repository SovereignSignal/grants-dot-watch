profile: >
  The European High Performance Computing Joint Undertaking (EuroHPC JU) is
  an EU body building a world-class supercomputing ecosystem in Europe. It
  procures supercomputers, funds competitive Research & Innovation calls to
  advance HPC hardware, software, applications, and skills, and supports AI
  Factories that offer compute access and services across industrial
  sectors. Its funding promotes collaboration among researchers,
  businesses, and institutions.
