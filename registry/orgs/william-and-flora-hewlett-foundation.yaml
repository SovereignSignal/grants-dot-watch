profile: >
  Nonpartisan philanthropy that awards grants across programs including
  democracy, education, climate change, performing arts, and gender equity.
  Most grants go to organizations identified by the foundation itself, though
  it occasionally opens opportunities such as the Hewlett 50 Arts Commissions.
  It prioritizes long-term, flexible operating support, which accounted for
  nearly three-fourths of its grants in 2024.
