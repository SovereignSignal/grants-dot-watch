profile: >
  DICE (Decentralized Artificial Intelligence through Controlled Emergence) is a DARPA research
  program funding development of theory, algorithms, and multi-agent systems for scalable,
  resilient decentralized AI collectives that remain under human control. Funding flows through
  Broad Agency Announcements (BAAs) and contract-style awards rather than traditional grants,
  covering proposals in AI, control theory, and game theory. The program is actively soliciting
  research as part of the broader DARPA portfolio.
