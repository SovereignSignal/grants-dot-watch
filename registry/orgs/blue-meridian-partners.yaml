profile: >
  Blue Meridian Partners is a philanthropic collaboration that brings
  philanthropists together to find, fund, and scale solutions for economic
  mobility among young people and families in poverty. It manages over $4.5
  billion across four investment portfolios — Nationwide Solutions, Place
  Matters, The Studio @ Blue Meridian, and The Justice and Mobility Fund —
  and takes expressions of interest from grantseekers through its website.
