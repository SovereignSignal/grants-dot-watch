profile: >
  Philanthropic foundation established in 1913 that promotes the well-being of
  humanity through strategic grantmaking in health, food systems, energy
  access, and economic opportunity, in the United States and globally. It does
  not accept unsolicited proposals; instead it works proactively, identifying
  problems and partners itself rather than running open calls.
