profile: Endaoment is an onchain donor-advised fund (DAF) platform that lets donors give stock,
  cash, and crypto to nonprofits, and it partnered with Circle to stand up a USDC-based disaster
  relief fund. It routes digital-asset donations to nonprofit and public-goods-adjacent recipients,
  functioning as philanthropic funding infrastructure rather than a classic grants program.
