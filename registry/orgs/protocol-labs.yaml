profile: >
  Protocol Labs is an R&D lab and innovation network advancing decentralized
  technologies such as IPFS and Filecoin while connecting startups, funds, and
  open source projects. Its historically broad Research Grants program (RFPs, open
  grants, and implementation awards up to $300k) has been indefinitely paused to
  new applications, while targeted ecosystem efforts continue, including Filecoin
  onboarding innovation grants via partnerships and the PL Genesis global builder
  series, whose hackathons have distributed $400k+ in prizes and feed a Founders
  Forge accelerator.
