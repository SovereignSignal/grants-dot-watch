profile: >
  Open Source Collective is a 501(c)(6) nonprofit fiscal host that provides
  financial and legal infrastructure for open source projects, including
  accounting, tax administration, expense processing, employment support, and
  legal compliance. It hosts more than 3,500 projects and manages their
  fundraising through the Open Collective platform. Projects apply through its
  website to join the fiscal hosting program.
