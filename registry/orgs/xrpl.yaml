profile: >
  XRPL refers to the XRP Ledger, an open-source, decentralized blockchain whose
  protocol development is stewarded by the XRP Ledger Foundation (XRPLF), an
  independent nonprofit separate from Ripple Labs that maintains core infrastructure
  such as the rippled server and the xrpl.js/xrpl-py/xrpl4j client libraries. Funding
  for builders on the ledger flows through several channels, including Ripple's XRPL
  Accelerator and its 2026 shift toward a distributed, $550M "XRPL FinTech Builder
  Program," plus community-run initiatives such as XRPL Commons' Glow retroactive
  funding and periodic ecosystem hackathons.
