profile: >
  Spotify, the music streaming company, maintains an open source program office that
  releases internal tools and supports the wider open-source ecosystem. Its Spotify FOSS
  Fund, launched in 2022, directly funds maintainers of critical independent open-source
  projects that Spotify's engineers rely on, with recipients selected through internal
  nomination processes and announced in periodic funding rounds.
