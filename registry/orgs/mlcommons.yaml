profile: >
  MLCommons is a member-driven consortium of more than 125 organizations that
  builds industry-standard tools for measuring AI systems. Its work spans
  performance benchmarks for AI accuracy, speed, and efficiency, an AI risk
  and reliability working group, and open datasets and standards such as the
  Croissant metadata vocabulary. It describes itself as community-driven and
  funded.
