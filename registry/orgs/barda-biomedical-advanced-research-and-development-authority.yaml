profile: >
  BARDA is a US federal authority within HHS's Administration for Strategic
  Preparedness and Response that funds the development of vaccines, drugs,
  therapies, and diagnostic tools for public health emergencies, including
  CBRN incidents and pandemic threats. It awards funding through industry
  partnerships and mechanisms such as broad agency announcements and
  TechWatch meetings, in areas like influenza, emerging infectious diseases,
  and pharmaceutical infrastructure.
funding:
  focus:
    - CBRN countermeasures
    - influenza and emerging infectious diseases
    - detection, diagnostics and devices infrastructure
    - pharmaceutical countermeasures infrastructure
    - health security innovation (DRIVe)
