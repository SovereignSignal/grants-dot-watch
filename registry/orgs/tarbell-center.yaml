profile: >
  The Tarbell Center for AI Journalism is a nonprofit supporting high-quality
  investigative reporting on AI. It makes grants of $1k-$20k for original stories
  published in established outlets, runs a flagship one-year Fellowship combining
  training with nine-month newsroom placements, and offers residencies for senior
  journalists. Programs run with judging panels and partner newsrooms such as
  Bloomberg and the Guardian; 2025 fellows have been announced and 2026
  applications are open.
