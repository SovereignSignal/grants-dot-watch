profile: >
  The Graph Foundation is the non-profit advancing The Graph, open-source technology for
  indexing and querying web3 data. It operates the Graph Grants program, funding protocol
  development, tooling, subgraphs, dApps, and growth initiatives from the community treasury,
  overseen by the Foundation and The Graph Council with domain-expert input. No RFPs are
  currently open, but the program remains active with past large allocations, and its 2024
  Annual Grants Report highlighted ecosystem impact.
funding:
  focus:
    - protocol (smart contracts, network operations, Graph Node development)
    - tooling (subgraph and indexer tools)
    - data services (subgraphs and Substreams)
    - community (education, events, developer support)
  cadence: "No open RFPs at time of check; historically distributed in numbered waves (e.g. Wave 3-5)"
