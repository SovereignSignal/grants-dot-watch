profile: >
  ClimateWorks Foundation is a philanthropic organization that connects
  funders and implementers to build and scale climate solutions, granting
  over $2 billion since 2008 and working with more than 80 philanthropic
  funders and 850+ grantees across 50+ countries. Its programs span 13+
  focus areas including carbon dioxide removal, aviation and maritime
  shipping, food and agriculture, industry and power, and sustainable
  finance. The site was actively maintained as of 2026 with recent
  funding announcements.
