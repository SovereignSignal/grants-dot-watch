profile: >
  Nonprofit steward supporting the Uniswap protocol, Unichain, v4 hooks,
  research, and governance. It runs protocol grants, ecosystem grants, a hook
  incubator, audit subsidies, and research programs; it committed $26M in new
  grants and disbursed $11M in FY2025, with $106M earmarked overall.
  Additional funding has been approved via governance; the foundation plans
  to close operations after deploying its remaining (~$100M) grants budget.
