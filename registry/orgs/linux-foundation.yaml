profile: >
  Linux Foundation is a nonprofit that hosts and stewards over 1,300 open-source
  projects, including Kubernetes and the Cloud Native Computing Foundation. It funds
  open-source security work, training scholarships, and event travel grants, and
  recently channeled a large pool of corporate-backed funding (from members including
  AWS, Google, Microsoft, and OpenAI) into Alpha-Omega and OpenSSF security
  initiatives. It also runs LFX Mentorship, a paid apprenticeship connecting
  contributors with member open-source projects.
