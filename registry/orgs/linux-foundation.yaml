id: linux-foundation
name: Linux Foundation
aka:
  - The Linux Foundation
  - Linux Foundation Education
systems: [oss-sustainability]
wires: [oss]
roles: [funder]
org_type: nonprofit
website: https://www.linuxfoundation.org/
socials:
  x: https://x.com/linuxfoundation
  github: https://github.com/linuxfoundation
status: active
profile: >
  Neutral nonprofit that hosts more than 1,300 open-source projects and runs
  its own community funding through training scholarships, event travel support,
  and paid mentorships. Security grantmaking sits with hosted allocating
  identities such as the Open Source Security Foundation and Alpha-Omega, not
  on a single Linux Foundation application form.
funding:
  focus:
    - training scholarships
    - event travel
    - registration scholarships
    - mentorship stipends
  cadence: >
    LiFT scholarships open each April; event travel and registration
    scholarships follow per-event deadlines; LFX Mentorship runs spring,
    summer, and fall terms on the LFX platform.
sources:
  - https://www.linuxfoundation.org/
  - https://www.linuxfoundation.org/about/lift-scholarships
  - https://events.linuxfoundation.org/about/travel-fund-request/
  - https://mentorship.lfx.linuxfoundation.org/
  - https://www.linuxfoundation.org/blog/strengthening-lfx-mentoring-a-fairer-stipend-model-and-a-shared-standard-of-excellence
