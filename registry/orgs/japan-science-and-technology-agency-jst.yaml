profile: >
  JST is a Japanese government science and technology agency that supports
  the whole process from the creation of knowledge to its return to society.
  It actively funds research through numerous open calls for proposals,
  including collaborative research programs with countries such as Canada,
  Thailand, and Indonesia, plus international exchange programs.
