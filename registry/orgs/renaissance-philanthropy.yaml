profile: >
  Renaissance Philanthropy is a 501(c)(3) that builds time-bound,
  thesis-driven philanthropic funds, enabling philanthropists to support
  science, technology, and innovation without establishing large internal
  teams. It reports catalyzing $533 million in philanthropic capital in its
  first two years, $268 million raised directly and $265 million through
  matchmaking.
