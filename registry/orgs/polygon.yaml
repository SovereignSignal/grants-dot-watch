profile: >
  Polygon operates a Community Treasury and Grants Program (successor to Polygon
  Village) that has allocated tens of millions of POL tokens for builders across AI,
  DePIN, gaming, consumer apps, DeFi, and infrastructure. Season 2 (January–April
  2025) made up to 35M POL available, split between a themed Grant Allocators Track
  run by partners like Gitcoin, IoTeX, and Eliza Labs, and a Direct Track open to any
  category, following Season 1's 18M POL distributed across 70+ projects. Funding is
  milestone-based and governed through the Polygon forum and GitHub proposals.
