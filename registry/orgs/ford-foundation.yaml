profile: >
  Ford Foundation is a major US philanthropic foundation that treats open- source software as public
  digital infrastructure, a framing set out in its "Roads and Bridges" report. It has co-funded
  Digital Infrastructure Research grants alongside the Alfred P. Sloan Foundation, Mozilla, Omidyar
  Network, and Open Society Foundations (fiscally hosted by Open Collective Foundation for the 2020
  round), supporting research into sustaining open-source maintainer communities and dismantling
  systemic inequities in the field. The programme has run across at least two waves, 2018 and 2020,
  and remains an active area of Ford's technology-and- society work.
