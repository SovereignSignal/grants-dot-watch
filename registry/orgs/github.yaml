systems: [oss-sustainability]
wires: [oss]
roles: [funder]
org_type: company
website: https://github.com/open-source
socials:
  x: https://x.com/github
  github: https://github.com/open-source
status: active
profile: >
  GitHub (Microsoft) operates multiple open-source funding channels: GitHub
  Sponsors for recurring support to maintainers, the GitHub Accelerator
  (equity-free support for OSS teams to work full-time), the GitHub Fund (VC
  investments in OSS companies via M12), and the Secure Open Source Fund,
  which pairs $10,000 per-project funding with security education and expert
  support for maintainers of critical projects. These programs have
  distributed over $130M and continue expanding, with Secure Open Source Fund
  sessions running into 2025/2026.
funding:
  focus:
    - open source security
    - software supply chain
    - maintainer security education
    - critical dependencies
    - vulnerability reduction
    - secure development practices
  typical_size: >
    $10,000 per project ($6,000 during the program, $2,000 at the 6-month
    check-in, $2,000 at the 12-month check-in)
  cadence: >
    Multi-week sessions/cohorts (a 3-week security education program);
    applications accepted on a rolling basis, with applicants considered for
    upcoming sessions without reapplying.
  apply_url: https://docs.google.com/forms/d/e/1FAIpQLScDBalom0XhmJrvyI3kwD7dZ-dD4_uhmLNysVXtA8fH_WUKoA/viewform
sources:
  - https://github.com/open-source
  - https://resources.github.com/github-secure-open-source-fund/
  - https://github.blog/open-source/maintainers/securing-the-supply-chain-at-scale-starting-with-71-important-open-source-projects/
  - https://github.blog/open-source/maintainers/securing-the-ai-software-supply-chain-security-results-across-67-open-source-projects/
