profile: >
  The Human Rights Foundation (HRF) runs the AI for Individual Rights Fund, which provides
  grants to activists, researchers, and open-source developers building privacy-preserving and
  open AI tools while exposing authoritarian uses of AI. Funding moves through direct grants,
  hackathons such as AI Hack for Freedom, and events. The program is actively growing, with
  frequent awards and new cohorts.
