profile: >
  Amazon Web Services funds research with cloud credits rather than cash. Its
  Cloud Credit for Research program awards AWS Promotional Credit to full-time
  faculty and enrolled graduate or PhD students at accredited research
  institutions for building cloud-hosted tools, proof-of-concept tests, and
  training communities on cloud research workloads. Applications are reviewed
  on a rolling 90-120 day cycle; student awards are capped at $5,000 while
  faculty and staff awards are uncapped.
funding:
  focus:
    - cloud-hosted research tools and applications
    - proof-of-concept / benchmark testing
    - research community training on cloud workloads
  typical_size: "$5,000 max for students; uncapped for faculty/staff"
  cadence: "Rolling review, 90-120 day review cycle"
  apply_url: https://pages.awscloud.com/aws-cloud-credit-for-research.html
sources:
