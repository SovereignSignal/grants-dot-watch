profile: >
  The Digital Brain Project is an open, collaborative neuroscience-AI initiative, backed by the
  Rothschild Foundation Hospital with $5M, that collects, structures, and shares high-quality
  human brain data for building foundational models of intelligent behavior. It funds research
  grants, data acquisition, and interdisciplinary work across neuroscience, AI, and medicine,
  and recently launched with calls for participants, tasks, and data contributions.
