profile: >
  The FreeBSD Foundation supports the FreeBSD operating system project. It
  funds development work directly (for example laptop sleep handling and
  userland development projects) and administers grants, inviting proposals
  through an open "Apply for a Grant" process and offering travel grants such
  as the EuroBSDCon 2026 travel grant.
