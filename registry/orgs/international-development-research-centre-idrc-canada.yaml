profile: >
  The International Development Research Centre (IDRC) is a Canadian
  government research funding organization that supports research for
  sustainable development worldwide. It funds work across five program
  areas — climate-resilient food systems, global health, education and
  science, democratic and inclusive governance, and sustainable inclusive
  economies — and offers grants and awards directly to researchers and
  institutions.
