profile: >
  Apple Scholars in AI/ML is Apple's PhD fellowship program, providing
  funding, mentorship with Apple researchers, and internship opportunities to
  emerging researchers in artificial intelligence and machine learning.
  Candidates are nominated by their universities and selected on research,
  leadership, and field impact. As of its 2025 cohort (the program's sixth
  year) it had supported over 100 graduate-level researchers.
funding:
