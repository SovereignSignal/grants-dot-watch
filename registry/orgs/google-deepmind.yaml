profile: >-
  **Google DeepMind AI Research Foundations Curriculum** is delivering AI/ML curriculum to students
  at 15 African universities. The program includes travel support to the DSA '26 conference. 


  It is open to students with no listed deadline. 


  Other rolling opportunities include DEEP Projects Grants and RFPs offering over $1.25M for
  beneficial AGI projects such as Hyperon tooling and social good AI, and the SuperDapp AI Agents
  Grants Program distributing 50,000,000 SUPR to Web3 developers building AI-powered agents using
  the SuperDapp SDK.
