profile: JSPS administers KAKENHI, Japan's Grants-in-Aid for Scientific Research program, one of the
  country's largest public competitive funding schemes covering basic and applied research across
  all fields. JST's own reference guide to Japanese government funding programs lists JSPS alongside
  JST and NEDO as a core public R&D funding agency available to international collaborators.
