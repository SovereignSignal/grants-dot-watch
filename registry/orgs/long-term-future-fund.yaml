status: active
profile: >
  The Long-Term Future Fund (LTFF) is an Effective Altruism regranting fund making grants to
  individuals and projects addressing global catastrophic risks, with emphasis on advanced AI
  safety, biosecurity, and longtermist infrastructure. It has distributed more than $20M since 2017
  across hundreds of early-stage researchers and seeded organizations; applications are reviewed by
  expert fund managers, and it is particularly interested in small teams and individuals getting
  projects off the ground.
funding:
  focus:
    - AI safety
    - AI governance & policy
    - biosecurity & pandemic preparedness
    - global catastrophic risk reduction
    - longtermism
    - existential risk research
    - field-building / talent pipeline
  typical_size: |
    $1,000 to over $500,000 (recent grants roughly $6k-$175k)
  cadence: >
    Focused grant rounds plus an always-open application; off-deadline applications are evaluated in
    the next round.
