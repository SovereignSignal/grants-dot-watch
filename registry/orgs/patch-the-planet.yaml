profile: >
  Patch the Planet is an initiative by OpenAI and Trail of Bits, launched in June
  2026, that pairs security engineers with critical open source projects such as
  cURL, Python, and Sigstore to identify bugs, develop and test patches, improve
  tooling, and coordinate disclosures. Maintainers receive dedicated review weeks,
  security enhancements, and six months of ChatGPT Pro/Codex access; it does not
  appear to run traditional monetary grant or credit programs. Partners include
  HackerOne.
