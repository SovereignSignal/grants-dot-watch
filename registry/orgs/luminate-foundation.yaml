profile: >
  Luminate is a funding organization working toward a more equitable digital
  age, partnering with organizations working on technology and social justice.
  It reports $370m distributed to 500+ partners since 2018, with regional
  programs across Africa, Asia, Europe, Latin America, and Global Ecosystems,
  focused on digital rights, tech regulation, and challenging corporate power
  over technology.
