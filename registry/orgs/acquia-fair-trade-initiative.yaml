profile: >
  Acquia's Fair Trade Initiative is a structural funding commitment inside its partner
  program — 2% of every eligible partner deal, credited to the partner, is automatically
  directed to the Drupal Association to fund Drupal open-source infrastructure and
  development. Launched in 2026 alongside Acquia's new partner program, it replaces ad-hoc
  grants and sponsorships with revenue-tied support, with contributions tracked publicly and
  recognized quarterly. There is no grant application process; funding flows from
  commercial deals.
funding:
  focus:
    - Drupal open-source infrastructure and development
  cadence: >
    Automatic and continuous — 2% of every closed eligible partner deal is
    directed to the Drupal Association, with contributions recognized
    quarterly; there is no separate application cycle.
