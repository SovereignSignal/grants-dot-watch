profile: >
  Sui Foundation stewards the Sui blockchain ecosystem through a mix of funding
  mechanisms: Hydropower, its official non-dilutive accelerator offering mentorship
  and capital connections; a DeFi Moonshots program offering up to $500,000 in
  liquidity incentives to top protocol builders; Academic Research Awards (~$25,000
  per award) for blockchain science and security research; Requests for Proposals
  targeting specific technical or ecosystem challenges; and direct strategic
  investment in core-primitive builders.
