profile: XAO DAO is a hybrid decentralized autonomous organization Ripple is standing up for the XRP
  Ledger as part of a 2026 shift toward a more distributed funding model, letting members
  collectively allocate resources to developers and early-stage projects through community grants
  and DAO proposals. The move is tied to Ripple's broader $550 million funding push for the XRPL
  ecosystem; as of this sweep the XAO DAO site is a pre-launch signup page.
