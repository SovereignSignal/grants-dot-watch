profile: >
  A German public entity (subsidiary of SPRIND) administering the Sovereign Tech Fund, which makes
  strategic investments in foundational open-source software components critical to digital
  infrastructure, security, and innovation. It runs multiple funding programs including direct
  investments, resilience/bug bounties, fellowships, standards support, and challenges, and has
  deployed over EUR 24M to 60+ projects globally since 2022, operating under public procurement
  rules with a focus on open-source sustainability.
funding:
  focus:
    - open source software
    - digital infrastructure / base technologies
    - programming-language libraries
    - package managers
    - communication protocols
    - developer tooling
    - encryption / security
    - maintenance & sustainability
  typical_size: >
    Varies widely by project; published examples range from ~EUR 99,060 (coreutils) to ~EUR
    1,436,729 (Prossimo/Rustls)
