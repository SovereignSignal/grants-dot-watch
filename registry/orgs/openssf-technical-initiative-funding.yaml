id: openssf-technical-initiative-funding
name: OpenSSF Technical Initiative Funding
aka: ["OpenSSF", "Open Source Security Foundation"]
systems: [oss-sustainability]
wires: [oss]
roles: [funder]
org_type: nonprofit
website: https://openssf.org/
socials:
  x: https://x.com/OpenSSF
  github: https://github.com/ossf
status: active
profile: >
  OpenSSF (Open Source Security Foundation, part of the Linux Foundation) supports
  open source security through Technical Initiative Funding, which allocates
  resources such as audits, technical writers, and interns to the needs of its
  working groups and projects, with a defined request process and tiers up to
  $70k-$150k. It recently announced $12.5M in new grants from industry backers
  including AWS, Google, Microsoft, and OpenAI, managed with Alpha-Omega, for
  sustainable security work on critical open source infrastructure.
funding:
  focus:
    - open source security
    - security audits
    - technical writers
    - internships
    - working group / technical initiative support
  cadence: Technical Advisory Council reviews funding requests bi-monthly.
  apply_url: https://openssf.org/about/tac/technical-initiative-funding/
sources:
