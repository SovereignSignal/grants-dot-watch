profile: >
  UK public funding body that invests around 8 billion pounds of public money
  each year into research and innovation. It operates through nine entities:
  seven research councils (AHRC, BBSRC, ESRC, EPSRC, MRC, NERC, STFC),
  Research England, and Innovate UK. Funding is distributed via competitive
  open calls through its funding finder, with innovation funding applications
  handled at apply-for-innovation-funding.service.gov.uk.
funding:
  typical_size: "Ranges widely by scheme, from roughly £2,500 up to £7M+ per award"
