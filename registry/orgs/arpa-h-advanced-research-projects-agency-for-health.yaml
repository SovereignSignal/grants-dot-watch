profile: >
  ARPA-H is a US federal agency that funds high-risk, high-reward biomedical
  research on health challenges considered too big or too complex for
  traditional funding. It organizes work under four focus areas — Health
  Science Futures, Scalable Solutions, Proactive Health, and Resilient
  Systems — and awards funding through open solicitations listed on its site,
  with a public award directory of funded projects.
funding:
