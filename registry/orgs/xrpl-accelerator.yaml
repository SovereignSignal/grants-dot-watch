profile: >
  The XRPL Accelerator, run by Ripple, is a 12-week hybrid program offering up to $200k in
  non-dilutive grants plus mentorship and investor access to startups building on the XRP
  Ledger, with focus areas in DeFi, real-world assets, payments, and AI. It evolved from the
  XRPL Grants program, which funded 140+ projects since 2021, and runs multiple cohorts per
  year through a unified application, prioritizing measurable traction and partnering on
  venture pathways.
