profile: >
  Omidyar Network is a philanthropic investment firm, founded around Pierre Omidyar's
  giving, that funds work to shape technology's impact on society across three
  pillars: Culture of Tech, Governance of Tech, and Business of Tech. It deploys both
  nonprofit grants and for-profit/impact investments, with a current emphasis on
  responsible technology and ethical, equitable AI guardrails. It does not accept
  unsolicited applications for general funding, instead sourcing opportunities through
  research, referrals, and partner introductions; as of 2026 it is led by CEO Michele
  Jawando.
