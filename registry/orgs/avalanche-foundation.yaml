profile: >
  The Avalanche Foundation supports the Avalanche layer-1 network through
  several parallel funding tracks: the retroactive Retro9000 programme on
  C-Chain (monthly rounds, over $1M distributed to 19 projects in June
  2025), Team1 Builder Grants, research grants, and the Blizzard Fund for
  venture-style investment. New research funding calls continued into 2026,
  with no signs of the programmes winding down.
