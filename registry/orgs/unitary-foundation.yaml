profile: >
  Unitary Foundation is a 501(c)(3) nonprofit creating a quantum technology ecosystem that benefits
  the most people. It runs a simple microgrant program awarding $4k cash grants, with no
  organizational affiliation required, via a short form and a two-minute video, for open source
  quantum software, education, sensors, and more. It has awarded 100+ microgrants across 31+
  countries, work that has yielded 420+ papers and 40+ software libraries, and continues with annual
  reports and a new advisory board in 2025.
