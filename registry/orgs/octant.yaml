  epoch-based community allocation. Recent tracked activity includes ecosystem funding
  deployments to projects such as Shutter Network and a proposed yield-powered matching
  collaboration with Gitcoin for the GG25 round. Community discussion runs on its public
  forum at discuss.octant.app.
