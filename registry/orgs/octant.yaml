profile: >
  Octant is an Ethereum-ecosystem funder that allocates capital to public goods through
  epoch-based community allocation. Its vault infrastructure has been adopted by other
  ecosystem initiatives, including Shutter DAO's Shutter Champions program, and it has a
  proposed yield-powered matching collaboration with Gitcoin for the GG25 round. Community
  discussion runs on its public forum at discuss.octant.app.
