profile: >
  Schmidt Sciences is a philanthropic nonprofit founded by Eric and Wendy Schmidt that
  funds hypothesis-driven scientific research through targeted grant programs and
  virtual institutes, with a strong focus on AI safety and advanced computing
  alongside other scientific domains. Its Science of Trustworthy AI program funds
  technical research to understand, predict, and control risks from advanced AI
  systems, in two funding tiers (up to $1M, and $1M–$5M+ over one to three years).
  Schmidt Sciences proactively solicits proposals through open RFPs and does not
  accept unsolicited applications.
