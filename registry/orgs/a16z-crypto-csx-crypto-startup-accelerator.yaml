profile: >
  CSX is a16z crypto's intensive, in-person accelerator for early-stage
  crypto and web3 startups, investing $500,000 for 7% equity and providing
  mentorship, workshops, and access to the a16z network, culminating in a
  Demo Day. It runs two cohorts per year (Spring and Fall) in rotating cities
  such as San Francisco, New York City, and London; teams apply globally but
  founders must commit to the in-person program for its ~10-12 week duration.
