profile: >
  Stacks Endowment is the treasury and grants arm of the Stacks Bitcoin L2 ecosystem,
  deploying capital across DeFi liquidity, protocol treasuries, and ecosystem grants
  to drive onchain growth and builder activity. It runs two grant tracks — Builder
  Grants (up to $50,000, for traction-stage teams) and Getting Started Grants (up to
  $10,000, for early prototypes) — plus community-led DeGrants cohorts (Cohort 4
  applications running as of mid-2026), funded from SIP-031-allocated STX and
  strategic partners.
