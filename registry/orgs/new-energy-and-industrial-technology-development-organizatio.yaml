profile: >
  NEDO, Japan's New Energy and Industrial Technology Development Organization, is a government
  agency that funds research and development through project-based mechanisms. Its target technology
  fields include hydrogen, fuel cells, ammonia, and artificial intelligence, with initiatives such
  as the Green Innovation Fund and the Moonshot Research and Development Program, and international
  offices across Asia, Europe, and North America.
