profile: >
  ICTS (International Centre for Theoretical Sciences, TIFR Bengaluru) is a research institute
  advancing theoretical sciences through programs, schools, and collaborations in mathematics,
  physics, and related fields. Its funding takes the form of postdoctoral fellowships, summer
  and winter schools, discussion meetings, and support for individual researcher grants and
  fellowships (e.g., Simons Foundation, Murty Science Fellowship) rather than a broad ecosystem
  grant program; money flows via institutional budgets, external grants, and targeted positions.
  Operations are stable, with ongoing calls for postdocs and events.
