profile: >
  The Cisco Foundation is the corporate giving arm of Cisco. Through Cisco
  Global Impact Cash Grants it funds nonprofits and NGOs working on access
  to education, economic empowerment, crisis response, and climate
  regeneration. In 2021 it committed $100 million over ten years to climate
  grants and impact investments, with a portfolio spanning nature
  preservation and restoration, regenerative agriculture, climate finance,
  and climate education; a four-year review of that portfolio was published
  in late 2025.
