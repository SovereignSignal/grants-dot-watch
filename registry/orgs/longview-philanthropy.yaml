profile: >
  Longview Philanthropy provides free grantmaking services, including donor
  education, research, grant recommendations, and outcome reporting, to donors
  giving over $1 million annually. It focuses on challenges that could
  transform the world in the decades ahead, such as nuclear conflict,
  engineered pandemics, and misuse of artificial intelligence. Donors can make
  direct grants or contribute to Longview funds.
