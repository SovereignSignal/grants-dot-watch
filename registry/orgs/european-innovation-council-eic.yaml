profile: The European Innovation Council funds breakthrough, high-risk deep-tech innovation through
  instruments like EIC Pathfinder (research grants), EIC Transition (market-readiness grants), and
  EIC Accelerator (grant plus equity investment for startups/SMEs). Like the ERC, it runs under the
  Horizon Europe umbrella but is a distinct funding body not yet tracked.
