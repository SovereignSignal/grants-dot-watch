profile: >
  The Astralis Foundation is a philanthropic organization focused on ensuring
  AI develops safely and benefits humanity. It supports initiatives in three
  areas: building bridges between the West and Asia, advancing European AI
  safety, and communicating about AI risks and opportunities. It does not
  accept unsolicited grant applications, instead working with aligned funders
  and providing strategic support to philanthropists.
