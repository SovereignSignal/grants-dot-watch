profile: >
  The Responsible Technology Youth Power Fund makes one-year grants
  ($50,000-$100,000; new grantees up to $75,000, returning grantees up to
  $100,000) to youth-led or intergenerationally-led U.S. organizations
  building a safer, more equitable digital ecosystem, using a power-sharing
  grantmaking model that puts young leaders in funding-decision roles. It
  runs annual cohorts: the third cohort was announced in April 2026 and
  Fund 4 applications are expected to open in Fall 2026.
funding:
  focus:
    - responsible AI
    - tech accountability
    - youth mental health and well-being
    - technology-based climate solutions
    - digital equity
    - youth-led civic/tech organizing
