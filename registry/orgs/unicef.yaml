profile: >
  UNICEF, through its Innovation Fund and Office of Innovation, runs equity-free
  funding programs for early-stage, open-source frontier-tech startups working on
  problems affecting children, including dedicated Blockchain Ventures and an
  AI/Blockchain "Data and Trust" cohort. Selected teams receive up to $100,000 paid in
  crypto (ETH/BTC/USDC) plus technical mentorship and piloting support, with recurring
  calls aimed at startups in emerging markets.
funding:
  focus:
    - blockchain for social good
    - AI for data and trust
    - digital public goods
