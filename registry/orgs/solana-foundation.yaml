profile: >
  Solana Foundation is the Swiss nonprofit advancing decentralization, adoption, and
  security of the Solana network. It runs milestone-based grants and convertible
  grants for public goods — more than 500 projects and over $100M deployed across
  tooling, DeFi, education, and payments — plus an active RFP process and security
  programs. Applications are reviewed on a rolling basis, with review taking roughly a
  week and a decision within about three weeks.
funding:
  focus:
    - DeFi
    - DePIN
    - gaming
    - NFTs
    - public goods
    - open-source infrastructure
    - developer tooling
  cadence: Rolling; application review ~1 week, decision and contact ~3 weeks
  eligibility: Open to individuals, independent teams, governments, nonprofits, companies, universities, and academics; grants are milestone-based and must generate public goods
  apply_url: https://solana.org/grants-funding
