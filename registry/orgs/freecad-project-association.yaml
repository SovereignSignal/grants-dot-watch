profile: >
  The FreeCAD Project Association is an international non-profit association
  created by FreeCAD administrators and core developers in November 2021 and
  seated in Belgium, with the goal of supporting and protecting the FreeCAD
  project. It offers grants to improve FreeCAD and its ecosystem and manages
  project donations.
