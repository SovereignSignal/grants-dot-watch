profile: >
  Gnosis DAO governs Gnosis Chain and related products, using token-weighted voting and forum
  proposals covering treasury, growth funds, and infrastructure. It historically ran grants via
  GECO; current funding activity centers on participatory funding pilots such as Gardens conviction
  voting, cashback programs, and annual budget requests (roughly $30M/yr proposed for operations and
  infrastructure). Programs are active but under ongoing governance adjustment, including budget
  extensions, white-hat rewards, and treasury-redemption debates.
