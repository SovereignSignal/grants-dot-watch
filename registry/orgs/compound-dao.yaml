profile: >
  Compound is an EVM-compatible lending protocol in which users supply
  crypto assets as collateral to borrow a base asset (USDC on Ethereum) or
  earn interest by supplying the base asset. The protocol is governed by
  the Compound DAO, with governance discussion hosted on the comp.xyz
  forum. Protocol documentation was live and current as of 2026.
sources:
