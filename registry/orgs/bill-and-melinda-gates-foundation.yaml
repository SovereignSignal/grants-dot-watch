    - infectious diseases
    - economic opportunity
  cadence: >
    Most grants go to 501(c)(3) partners identified by foundation staff, rather than an
    open call; periodic open Requests for Proposals are posted via Grand Challenges
    (gcgh.grandchallenges.org).
  apply_url: https://submit.gatesfoundation.org/
