profile: >
  The Gates Foundation is a nonprofit fighting poverty, disease, and inequity
  around the world, with major work in maternal and child health, infectious
  diseases, and economic opportunity. Its site reports 2,506 grants across 51
  program strategies and $8.5 billion in charitable support to 1,472
  grantees, made with partners around the world.
funding:
