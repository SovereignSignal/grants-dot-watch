profile: >
  The Institute for Security and Technology (IST) is a 501(c)(3) think tank uniting policy,
  technology, and industry leaders on digital security, catastrophic risk (including AI), and
  the geopolitics of technology. It runs events, working groups, and simulations (e.g. on
  ransomware), issues policy recommendations and memos on topics like AI transparency and
  loss-of-control risk, and publishes reports. It is funded by foundations, government, and
  individuals, with no major external grantmaking programs visible.
