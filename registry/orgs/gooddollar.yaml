profile: >
  GoodDollar is a non-profit protocol that generates and distributes G$, a global universal
  basic income currency backed by crypto reserves, governed by the GoodDAO. It runs ecosystem
  grant programs such as GoodBuilders (for integrations) and Prosperity Grants, where builders
  apply via form to a grant committee for funding and mentorship to grow G$ utility and
  real-world impact, including matching funds and incentives. Programs are active with
  community-driven initiatives and ongoing applications.
