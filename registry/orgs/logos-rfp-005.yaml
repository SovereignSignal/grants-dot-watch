profile: Logos RFP-005 (Multisig and Coordination) is open for proposals until October 16, 2026.
  Logos asks for an audited M-of-N multisig program on the Logos Execution Zone (LEZ) with an
  encrypted, metadata-resistant coordination channel for signers. The codebase must go through an
  independent security audit and be deployed on devnet/testnet, and proposals must include the audit
  budget as a line item. RFP tier L; grant amount not stated. Apply with the Submit Proposal link in
  the logos-co/rfp repository.
