profile: >
  The National Institutes of Health is a US government agency and the largest
  public funder of biomedical research in the world. It supports research
  through grants, contracts, and loan repayment programs; its Grants & Funding
  site (grants.nih.gov) guides applicants through the full funding process,
  from finding opportunities and writing applications to peer review, award,
  and post-award reporting.
