profile: >
  The Interchain Foundation (ICF) stewards the Cosmos ecosystem, funding development and
  adoption of the Interchain Stack (IBC, the Cosmos SDK) through a dedicated Funding
  Program and a restarted Grants Program. It earmarked $26.4M for 2024 funding across
  development, adoption, and public goods, and has formed Cosmos Labs (a rebrand of
  Interchain Labs) to consolidate product, growth, and development efforts. Its funding
  blends grants, investments, and ecosystem stewardship focused on interoperability and
  sustainability.
