profile: >
  Celo is a mobile-first, EVM-compatible layer-1 blockchain focused on
  real-world payments and adoption, governed by the Celo DAO with support
  from the Celo Foundation and cLabs. Ecosystem funding runs through
  CeloPG (public goods / retroactive grants), milestone-based grants,
  security subsidies, and Gitcoin-style quadratic-funding rounds, funded in
  CELO, cUSD, and OP each season.
