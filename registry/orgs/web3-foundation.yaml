id: web3-foundation
name: Web3 Foundation
aka:
  - Web3 Foundation (Polkadot) grants
  - web3 polkadot
systems: []
wires: [crypto]
roles: [funder]
org_type: foundation
website: https://web3.foundation/
socials:
  x: https://x.com/Web3foundation
  github: https://github.com/w3f
status: active
profile: >
  Web3 Foundation funds research and development for the decentralized web
  and is best known for its role incubating Polkadot and Substrate. It
  previously ran a large open Grants Program for technical projects in the
  Polkadot/Kusama ecosystem but has discontinued general applications,
  shifting to Targeted Strategic Funding, the Decentralized Futures program,
  product-focused initiatives, participation in Polkadot OpenGov, and
  hands-on support for key projects, in line with Polkadot's maturation.
funding:
  focus:
    - Polkadot
    - Kusama
    - Substrate
    - ink!
    - core infrastructure
    - developer tooling
    - open-source software
    - research
  typical_size: >
    Historical levels (open program now closed): Level 1 up to $10,000;
    Level 2 up to $30,000; Level 3 unlimited. At least 50% typically paid in
    vested DOT over 2 years, remainder in USDC.
  apply_url: https://github.com/w3f/Grants-Program
sources:
  - https://web3.foundation/
  - https://github.com/w3f/Grants-Program
  - https://github.com/w3f/Grants-Program/blob/master/applications/index.md
  - https://medium.com/web3foundation/aligning-web3-foundation-grants-program-with-polkadots-product-centric-vision-9ae83baafdc3
