id: lido
name: Lido
aka: [Lido Finance]
systems: [ethereum]
wires: [crypto]
roles: [funder]
org_type: dao
website: https://lido.fi/
socials:
  x: https://x.com/LidoFinance
  github: https://github.com/lidofinance
  forum: https://research.lido.fi/
status: active
profile: >
  Lido is a liquid staking protocol for Ethereum: users stake ETH and receive
  stETH while keeping liquidity, with 100+ integrations across DeFi. The
  protocol is governed by Lido DAO, whose governance framework includes LEGO
  grants for ecosystem contributors; governance discussion happens on the
  research.lido.fi forum.
funding:
  focus:
    - developer contributions to the Lido protocol
    - community awareness
    - Ethereum proof-of-stake ecosystem improvements
    - DeFi integrations
  typical_size: "Tiered: Sandgrain up to $1,000, Pebble up to $10,000, Boulder up to $100,000, Mountain $100,000+"
  cadence: "Rolling; ~15,000 LDO-equivalent quarterly capacity per LEGO Council domain track"
sources:
