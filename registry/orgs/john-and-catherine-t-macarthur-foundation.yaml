profile: >
  The John D. and Catherine T. MacArthur Foundation invests in creative
  solutions to critical challenges across focus areas including climate
  solutions, criminal justice reform, local news, AI opportunity, and
  journalism and media. It also awards MacArthur Fellowships and funds the
  100&Change prize, supporting organizations and individuals working on
  social impact globally. Applications run through a Fluxx grantee portal.
