profile: >
  RISC-V International is the organization that develops and maintains the
  open, royalty-free RISC-V instruction set architecture, with members
  collaborating in technical working groups to create specifications. It runs
  summits, training, and certification programs across industries including
  automotive, AI, and HPC; its website does not describe a grants program it
  administers.
