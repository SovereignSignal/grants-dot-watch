profile: >
  Lacuna Fund is a multi-funder, multi-stakeholder collaboration formed in
  2020 to fill gaps in the data used to train machine learning models, making
  ML and AI more representative, accurate, equitable, and accessible to
  underserved communities. It has enabled the creation of over 75 new ML
  datasets in agriculture, climate, health, and low-resource languages via
  requests for proposals. In July 2025 it announced the transfer of its
  leadership and management to partner institutions in Africa and Latin
  America.
