profile: The AI4D Research & Innovation for Climate (RICH) Hub is inviting African-led or
  Africa-based climate AI innovations at pilot stage or beyond to submit Expressions of Interest
  (posted October 13, 2026). Selected innovations may access technical and innovation support,
  coaching, piloting opportunities and potential scaling grants of up to USD 200,000, depending on
  eligibility, assessment and available resources. EOIs are accepted on a rolling basis; submitting
  an EOI does not guarantee selection or funding.
