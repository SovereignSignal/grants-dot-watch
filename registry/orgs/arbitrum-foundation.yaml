profile: >
  The Arbitrum Foundation stewards the Arbitrum DAO and L2 ecosystem on Ethereum, operating a
  milestone-based grant program (typical awards $20k-$150k in ARB) alongside specialized initiatives
  like Trailblazer, Audit Subsidy, Arbifuel, and DRIP to drive adoption, infrastructure, and
  community growth. Community-elected domain allocators also distribute milestone-based grants via
  Questbook across domains such as developer tooling, education, gaming, and new protocols. Programs
  are active and expanding, including a $16M funding proposal in May 2026.
funding:
  focus:
    - developer tooling & infrastructure
    - education
    - gaming
    - new protocols & ideas
    - community growth
    - ecosystem adoption on Arbitrum
  cadence: >
    Quarterly; domain allocators are elected by the community, and at the end of each quarter the
    community can vote to replace or continue allocators and adjust budgets. Funding is
    milestone-based and approved on a rolling basis within a domain.
  apply_url: https://arbitrum.questbook.app/
