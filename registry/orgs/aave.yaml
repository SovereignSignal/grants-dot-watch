profile: >
  Aave is a DeFi lending protocol governed by Aave DAO. Ecosystem grants flow
  through Aave Grants, a community sub-DAO funded through the Aave DAO governance
  process, which accepts rolling applications with no deadlines and announces new
  grantees monthly across categories including applications and integrations,
  code audits, developer tooling, community, events and hackathons, and protocol
  development; it has awarded more than $4M historically. In April 2026 the DAO
  additionally approved a $25M funding grant to Aave Labs in a binding governance
  vote.
