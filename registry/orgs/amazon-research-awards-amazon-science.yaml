profile: >
  Amazon Research Awards (ARA) is Amazon's academic funding program, offering
  unrestricted funds and AWS Promotional Credits to support research at
  academic institutions and non-profit organizations. Funded domains include
  machine learning, robotics, sustainability, and security. Applications run
  through calls for proposals published on the program page.
