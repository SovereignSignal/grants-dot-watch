profile: >
  Co-Impact is a global collaborative that pools funding from multiple
  partners to strengthen health, education, and economic systems, aiming to
  deploy over $1 billion by 2030. Through its Foundational Fund and Gender
  Fund it has mobilized over $870 million and funded more than 140
  initiatives, supporting locally rooted organizations across Africa, Asia,
  and Latin America with flexible long-term funding and strategic support.
  The site was active with news dated June 2026.
