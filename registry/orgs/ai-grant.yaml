profile: >
  AI Grant is an accelerator-style fund for seed-stage AI startups, run by Hersh Desai and
  Lenny Bogdonoff and backed by Nat Friedman and Daniel Gross with a $10M commitment. It
  invests $250,000 on an uncapped SAFE plus large compute and tooling credit packages
  (including $350,000 in Azure credits), and has funded 85 companies across four batches.
  It also maintains a separate grant track for open-source AI projects.
