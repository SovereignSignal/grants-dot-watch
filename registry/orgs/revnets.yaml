profile: >
  Revnets (Revenue Networks) is an Ethereum-based protocol for deploying autonomous,
  immutable, rule-based treasuries that tokenize revenues or fundraises and distribute them
  automatically to participants without centralized operators. It runs no traditional grant
  program — the protocol itself is the funding mechanism, governed by immutable rules and
  $REV token economics. The protocol has seen security audits and version updates, including
  a reported V5 exploit remediation.
